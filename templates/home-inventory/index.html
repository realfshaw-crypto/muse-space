<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Inventory — Muse Space Template | Pantry, Expiry Tracker &amp; Chores</title>
<meta name="description" content="Home Inventory — a Muse Space template to track household stock, expiry dates, low-stock alerts and chores.">
<style>
:root {
  color-scheme: light dark;

  /* ===== Color: core semantic ===== */
  --color-accent: light-dark(#0064E0, #0171E3);
  --color-accent-muted: light-dark(#0082FB33, #0082FB3F);

  --color-background-body: light-dark(#F1F4F7, #111112);
  --color-background-surface: light-dark(#FFFFFF, #1F1F22);
  --color-background-card: light-dark(#FFFFFF, #1F1F22);
  --color-background-popover: light-dark(#FFFFFF, #28292C);
  --color-background-muted: light-dark(#0536590C, #1111127F);
  --color-background-inverted: light-dark(#0A1317, #FFFFFF);
  --color-overlay: light-dark(#01122866, #11111299);
  --color-overlay-hover: light-dark(#0536590C, #FFFFFF0C);
  --color-overlay-pressed: light-dark(#05365919, #FFFFFF19);

  --color-icon-accent: light-dark(#0064E0, #2694FE);

  --color-icon-secondary: light-dark(#4E606F, #AAAFB5);
  --color-icon-disabled: light-dark(#A4B0BC, #6F747C);

  /* Status fills + muted + on-* */
  --color-info: light-dark(#0064E0, #0064E0);
  --color-info-muted: light-dark(#0082FB33, #0082FB3F);
  --color-on-info: light-dark(#FFFFFF, #FFFFFF);
  --color-success: light-dark(#0D8626, #0D8626);

  --color-text-warning: var(--color-text-yellow);
  --color-text-error: var(--color-text-red);
  --color-icon-info: var(--color-text-info);
  --color-icon-success: var(--color-text-success);
  --color-icon-warning: var(--color-text-warning);
  --color-icon-error: var(--color-text-error);
  --color-border-info: var(--color-text-info);
  --color-border-success: var(--color-text-success);
  --color-border-warning: var(--color-text-warning);
  --color-border-error: var(--color-text-error);
  --color-on-info-muted: var(--color-text-blue);
  --color-on-success-muted: var(--color-text-green);
  --color-on-warning-muted: var(--color-text-yellow);
  --color-on-error-muted: var(--color-text-red);

  /* Border / effects */
  --color-border: light-dark(#05365919, #F2F4F619);
  --color-border-emphasized: light-dark(#CCD3DB, #494D53);

  --color-track: light-dark(#CCD3DB, #5A5E66);
  --color-shadow: light-dark(rgba(5, 54, 89, 0.1), rgba(0, 0, 0, 0.3));

  /* Hue families: background(33 alpha) / border / icon / text */
  --color-background-blue: light-dark(#0171E333, #0171E333);

  --color-border-cyan: light-dark(#089DD0, #0171A4);
  --color-icon-cyan: light-dark(#00ACC1, #26C6DA);
  --color-text-cyan: light-dark(#014975, #A1EEF9);
  --color-background-gray: light-dark(#0A131733, #666A724C);
  --color-border-gray: light-dark(#647685, #748695);
  --color-icon-gray: light-dark(#4E606F, #AAAFB5);
  --color-text-gray: light-dark(#0A1317, #E7EAED);
  --color-background-green: light-dark(#24BB5E33, #24BB5E33);
  --color-border-green: light-dark(#0D8626, #0B991F);
  --color-icon-green: light-dark(#0D8626, #26A756);
  --color-background-orange: light-dark(#F2790233, #F2790233);
  --color-border-orange: light-dark(#EB6E00, #B34A01);
  --color-icon-orange: light-dark(#E9690B, #FB8C00);
  --color-text-orange: light-dark(#6B2203, #FDB876);
  --color-background-pink: light-dark(#E638B333, #E638B333);
  --color-border-pink: light-dark(#F351C0, #C02294);
  --color-icon-pink: light-dark(#C2185B, #EC407A);
  --color-text-pink: light-dark(#650053, #FEADE3);
  --color-background-purple: light-dark(#7952FF33, #7952FF33);
  --color-border-purple: light-dark(#9081FF, #7340FE);
  --color-icon-purple: light-dark(#5B08D8, #7952FF);
  --color-text-purple: light-dark(#3E0697, #B3B0FE);
  --color-background-red: light-dark(#E3193B33, #E3193B33);
  --color-border-red: light-dark(#E3193B, #F5394F);
  --color-icon-red: light-dark(#D31130, #E3193B);
  --color-background-teal: light-dark(#0DB7AF33, #0DB7AF33);
  --color-border-teal: light-dark(#08A3A3, #08767D);
  --color-icon-teal: light-dark(#009688, #26A69A);
  --color-text-teal: light-dark(#083943, #40DCCD);
  --color-background-yellow: light-dark(#E2A40033, #E2A40033);
  --color-border-yellow: light-dark(#C58600, #B47700);
  --color-icon-yellow: light-dark(#FBC02D, #FFEE58);

  /* ===== Spacing: 4px 基准、rem 制（随根字号缩放），步进 0..12 ===== */
  --spacing-0: 0rem;
  --spacing-0-5: 0.125rem;
  --spacing-1: 0.25rem;
  --spacing-1-5: 0.375rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-5: 1.25rem;
  --spacing-6: 1.5rem;
  --spacing-7: 1.75rem;
  --spacing-8: 2rem;
  --spacing-9: 2.25rem;
  --spacing-10: 2.5rem;
  --spacing-11: 2.75rem;
  --spacing-12: 3rem;

  /* ===== Size: 控件高度 ===== */
  --size-element-sm: 28px;
  --size-element-md: 32px;
  --size-element-lg: 36px;

  /* ===== Border / Focus ===== */
  --border-width: 1px;
  --focus-outline-width: 2px;
  --focus-outline-style: solid;
  --focus-outline-color: var(--color-accent);
  --focus-outline-offset: 3px;

  /* ===== Radius（core 默认；neutral 主题的 6/10/12/28 变体不采用） ===== */
  --radius-none: 0px;
  --radius-inner: 4px;
  --radius-element: 8px;
  --radius-container: 12px;
  --radius-page: 28px;
  --radius-chat: 28px;
  --radius-full: 9999px;

  /* ===== Shadow ===== */
  --shadow-low: 0px 1px 1px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 2px 8px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2));
  --shadow-med: 0px 1px 2px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 2px 12px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2));
  --shadow-high: 0px 2px 2px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 8px 24px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3));
  --shadow-inset-hover: inset 0px 0px 0px 2px light-dark(rgba(5, 54, 89, 0.15), rgba(223, 226, 229, 0.2));
  --shadow-inset-selected: inset 0px 0px 0px 2px rgba(1, 113, 227, 0.5);
  --shadow-inset-success: inset 0px 0px 0px 2px rgba(38, 167, 86, 0.3);
  --shadow-inset-warning: inset 0px 0px 0px 2px rgba(226, 164, 0, 0.3);
  --shadow-inset-error: inset 0px 0px 0px 2px rgba(227, 25, 59, 0.3);

  /* ===== Motion ===== */
  --duration-fast-min: 130ms;
  --duration-fast: 175ms;
  --duration-fast-max: 230ms;
  --duration-medium-min: 310ms;
  --duration-medium: 410ms;
  --duration-medium-max: 550ms;
  --duration-slow-min: 730ms;
  --duration-slow: 975ms;
  --duration-slow-max: 1300ms;
  --duration-exit: var(--duration-fast);
  --ease-standard: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-entrance: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-move: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-exit: cubic-bezier(0.3, 0, 0.6, 0.6);

  /* ===== Typography ===== */
  --font-family-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-family-heading: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-family-code: "SF Mono", Monaco, Consolas, monospace;

  /* 几何字阶：round(14 x 1.2^step) */
  --font-size-4xs: 0.375rem;
  --font-size-3xs: 0.4375rem;
  --font-size-2xs: 0.5rem;
  --font-size-xs: 0.625rem;
  --font-size-sm: 0.75rem;
  --font-size-base: 0.875rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.8125rem;
  --font-size-4xl: 2.1875rem;
  --font-size-5xl: 2.625rem;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* 语义字型（size / weight / leading 三件套，组件只许用这一层） */
  --text-heading-1-size: var(--font-size-2xl); --text-heading-1-weight: var(--font-weight-semibold); --text-heading-1-leading: 1.3333;
  --text-heading-2-size: var(--font-size-xl); --text-heading-2-weight: var(--font-weight-semibold); --text-heading-2-leading: 1.4;
  --text-heading-3-size: var(--font-size-lg); --text-heading-3-weight: var(--font-weight-semibold); --text-heading-3-leading: 1.4118;
  --text-heading-4-size: var(--font-size-base); --text-heading-4-weight: var(--font-weight-semibold); --text-heading-4-leading: 1.4286;
  --text-heading-5-size: var(--font-size-sm); --text-heading-5-weight: var(--font-weight-semibold); --text-heading-5-leading: 1.6667;
  --text-heading-6-size: var(--font-size-xs); --text-heading-6-weight: var(--font-weight-semibold); --text-heading-6-leading: 1.6;
  --text-body-size: var(--font-size-base); --text-body-weight: var(--font-weight-normal); --text-body-leading: 1.4286;
  --text-large-size: var(--font-size-lg); --text-large-weight: var(--font-weight-semibold); --text-large-leading: 1.4118;
  --text-label-size: var(--font-size-base); --text-label-weight: var(--font-weight-medium); --text-label-leading: 1.4286;
  --text-code-size: var(--font-size-base); --text-code-weight: var(--font-weight-normal); --text-code-leading: 1.4286;
  --text-supporting-size: var(--font-size-sm); --text-supporting-weight: var(--font-weight-normal); --text-supporting-leading: 1.6667;
  --text-display-1-size: var(--font-size-5xl); --text-display-1-weight: var(--font-weight-normal); --text-display-1-leading: 1.2381;
  --text-display-2-size: var(--font-size-4xl); --text-display-2-weight: var(--font-weight-normal); --text-display-2-leading: 1.2571;
  --text-display-3-size: var(--font-size-3xl); --text-display-3-weight: var(--font-weight-normal); --text-display-3-leading: 1.2414;
}
*{box-sizing:border-box}
body{margin:0;background:var(--color-background-body);color:var(--color-text-primary);font-family:var(--font-family-body);font-size:var(--text-body-size);font-weight:var(--text-body-weight);line-height:var(--text-body-leading)}
h1,h2,p{margin:0}
.wrap{max-width:52rem;margin:0 auto;padding:var(--spacing-6) var(--spacing-4) var(--spacing-12)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--spacing-4);margin-bottom:var(--spacing-5)}
h1{font-size:var(--text-heading-1-size);font-weight:var(--text-heading-1-weight);line-height:var(--text-heading-1-leading)}
.sub{color:var(--color-text-secondary);margin-top:var(--spacing-1)}
h2{font-size:var(--text-heading-3-size);font-weight:var(--text-heading-3-weight);line-height:var(--text-heading-3-leading);margin-bottom:var(--spacing-3)}
.card{background:var(--color-background-card);border:var(--border-width) solid var(--color-border);border-radius:var(--radius-container);padding:var(--spacing-5);box-shadow:var(--shadow-low);margin-bottom:var(--spacing-4)}
.muted{color:var(--color-text-secondary)}
.small{font-size:var(--text-supporting-size);line-height:var(--text-supporting-leading)}
.stats{display:flex;flex-wrap:wrap;gap:var(--spacing-6);align-items:center}
.stat b{display:block;font-size:var(--text-heading-2-size);font-weight:var(--text-heading-2-weight);line-height:var(--text-heading-2-leading)}
.form{display:grid;gap:var(--spacing-3);margin-bottom:var(--spacing-4)}
@media(min-width:40rem){.form{grid-template-columns:repeat(2,1fr)}.form .full{grid-column:1/-1}}
label{display:grid;gap:var(--spacing-1);font-size:var(--text-supporting-size);color:var(--color-text-secondary)}
input{height:var(--size-element-lg);padding:0 var(--spacing-3);border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-element);background:var(--color-background-surface);color:var(--color-text-primary);font:inherit;width:100%}
input[type=checkbox]{width:var(--spacing-5);height:var(--spacing-5);padding:0;accent-color:var(--color-accent);flex:none}
.btn{min-height:var(--size-element-lg);padding:0 var(--spacing-4);border:var(--border-width) solid transparent;border-radius:var(--radius-element);background:var(--color-accent);color:var(--color-on-accent);font:inherit;font-weight:var(--font-weight-medium);cursor:pointer;transition:transform var(--duration-fast) var(--ease-standard),opacity var(--duration-fast) var(--ease-standard)}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.97)}
.btn-ghost{background:var(--color-background-muted);color:var(--color-text-primary);border-color:var(--color-border)}
.btn-danger{background:var(--color-error-muted);color:var(--color-text-error)}
.btn-sm{min-height:var(--size-element-sm);padding:0 var(--spacing-3);font-size:var(--text-supporting-size)}
.row{display:flex;align-items:center;gap:var(--spacing-3);padding:var(--spacing-3) 0;border-bottom:var(--border-width) solid var(--color-border);animation:rise var(--duration-medium) var(--ease-entrance)}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.done-text{text-decoration:line-through;color:var(--color-text-secondary)}
.badge{display:inline-flex;align-items:center;padding:var(--spacing-0-5) var(--spacing-2);border-radius:var(--radius-full);background:var(--color-accent-muted);color:var(--color-text-accent);font-size:var(--text-supporting-size);white-space:nowrap}
.badge-ok{background:var(--color-success-muted);color:var(--color-text-success)}
.badge-warn{background:var(--color-warning-muted);color:var(--color-text-warning)}
.badge-err{background:var(--color-error-muted);color:var(--color-text-error)}
.empty{color:var(--color-text-secondary);text-align:center;padding:var(--spacing-6) var(--spacing-4)}
.inline-form{display:flex;gap:var(--spacing-2);flex-wrap:wrap}
.inline-form label{flex:1;min-width:10rem}
.alert-line{display:flex;align-items:center;gap:var(--spacing-2)}
.dot{width:var(--spacing-3);height:var(--spacing-3);border-radius:var(--radius-full);background:var(--color-warning);flex:none;animation:pulse var(--duration-slow) var(--ease-standard) infinite alternate}
.dot.err{background:var(--color-error)}
.qty-btn{min-height:var(--size-element-sm);width:var(--size-element-sm);padding:0}
footer{color:var(--color-text-disabled);text-align:center;margin-top:var(--spacing-6)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.35)}}
@keyframes rise{from{opacity:0;transform:translateY(var(--spacing-2))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="wrap">
<header class="top">
<div>
<h1 data-i18n="title">Home Inventory</h1>
<p class="sub" data-i18n="sub">Track stock, expiry dates and who does which chore.</p>
</div>
<button class="btn btn-ghost" id="langBtn" type="button">中文</button>
</header>
<main>
<section class="card" aria-label="Alerts">
<h2 data-i18n="alerts">Alerts</h2>
<div class="stats">
<div class="stat"><span class="muted small" data-i18n="items">Items</span><b id="statItems">0</b></div>
<div class="stat"><span class="muted small" data-i18n="low">Low stock</span><b id="statLow">0</b></div>
<div class="stat"><span class="muted small" data-i18n="expiring">Expiring soon</span><b id="statExp">0</b></div>
</div>
<div id="alertBox" style="margin-top:var(--spacing-3)"></div>
</section>
<section class="card" aria-label="Inventory">
<h2 data-i18n="inventory">Inventory</h2>
<form class="form" id="formItem">
<label><span data-i18n="name">Name</span><input name="name" required placeholder="Milk"></label>
<label><span data-i18n="qty">Quantity</span><input name="qty" type="number" min="0" step="1" value="1" required></label>
<label><span data-i18n="unit">Unit</span><input name="unit" placeholder="pcs / kg / bottle"></label>
<label><span data-i18n="expiry">Expiry date</span><input name="expiry" type="date" id="fExpiry"></label>
<button class="btn full" type="submit" data-i18n="addItem">Add item</button>
</form>
<div id="listItems"></div>
</section>
<section class="card" aria-label="Chores">
<h2 data-i18n="chores">Chores</h2>
<form class="inline-form" id="formChore" style="margin-bottom:var(--spacing-3)">
<label><span data-i18n="chore">Chore</span><input name="label" required placeholder="Take out trash"></label>
<label><span data-i18n="who">Who</span><input name="who" placeholder="Alex"></label>
<button class="btn" type="submit" data-i18n="addChore" style="align-self:end">Add chore</button>
</form>
<div id="listChores"></div>
</section>
</main>
<footer><p class="small">Muse Space · Home Inventory — data stays in this Space (localStorage). 数据只存在本空间内。</p></footer>
</div>
<script>
const KEY='muse-space:home-inventory';
const I18N={
en:{title:'Home Inventory',sub:'Track stock, expiry dates and who does which chore.',alerts:'Alerts',items:'Items',low:'Low stock',expiring:'Expiring soon',inventory:'Inventory',name:'Name',qty:'Quantity',unit:'Unit',expiry:'Expiry date',addItem:'Add item',chores:'Chores',chore:'Chore',who:'Who',addChore:'Add chore',emptyItems:'No items yet. Add your first item.',emptyChores:'No chores yet. Add one.',del:'Delete',lowBadge:'Low stock',expBadge:'Expiring',expiredBadge:'Expired',okBadge:'OK',noAlerts:'All good. Nothing low or expiring.',daysLeft:'d left',expiredBy:'Expired'},
zh:{title:'家庭库存',sub:'库存、保质期、家务分工一屏管。',alerts:'提醒',items:'物品数',low:'低库存',expiring:'临期',inventory:'库存',name:'名称',qty:'数量',unit:'单位',expiry:'保质期',addItem:'添加',chores:'家务清单',chore:'家务',who:'负责人',addChore:'添加家务',emptyItems:'还没有物品，添加第一件。',emptyChores:'还没有家务，添加一项。',del:'删除',lowBadge:'低库存',expBadge:'临期',expiredBadge:'已过期',okBadge:'正常',noAlerts:'一切正常，没有低库存或临期物品。',daysLeft:'天到期',expiredBy:'已过期'}};
let uid=1;
function dayStr(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.toISOString().slice(0,10)}
function defaults(){return {lang:'en',
items:[
{id:uid++,name:'Milk',qty:1,unit:'bottle',expiry:dayStr(2)},
{id:uid++,name:'Spinach',qty:2,unit:'bag',expiry:dayStr(1)},
{id:uid++,name:'Eggs',qty:12,unit:'pcs',expiry:dayStr(10)},
{id:uid++,name:'Rice',qty:5,unit:'kg',expiry:dayStr(180)},
{id:uid++,name:'Soy sauce',qty:1,unit:'bottle',expiry:dayStr(90)},
{id:uid++,name:'Laundry detergent',qty:3,unit:'bottle',expiry:dayStr(300)}],
chores:[
{id:uid++,label:'Take out trash',who:'Alex',done:false},
{id:uid++,label:'Clean kitchen',who:'Sam',done:true},
{id:uid++,label:'Water plants',who:'Alex',done:false}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
if(!S||!Array.isArray(S.items)||!Array.isArray(S.chores))S=defaults();
uid=S.items.concat(S.chores).reduce(function(m,x){return Math.max(m,x.id)},0)+1;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function t(k){return (I18N[S.lang]&&I18N[S.lang][k])||I18N.en[k]||k}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function daysLeft(exp){if(!exp)return null;const now=new Date();now.setHours(0,0,0,0);const d=new Date(exp+'T00:00:00');return Math.round((d-now)/86400000)}
function applyI18n(){document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'))});document.getElementById('langBtn').textContent=S.lang==='en'?'中文':'EN';document.documentElement.lang=S.lang==='en'?'en':'zh-CN'}
function badgesFor(it){
let out='';
const dl=daysLeft(it.expiry);
if(it.qty<=2)out+='<span class="badge badge-warn">'+t('lowBadge')+'</span> ';
if(dl!==null&&dl<0)out+='<span class="badge badge-err">'+t('expiredBadge')+'</span>';
else if(dl!==null&&dl<=7)out+='<span class="badge badge-warn">'+t('expBadge')+' · '+dl+' '+t('daysLeft')+'</span>';
else out+='<span class="badge badge-ok">'+t('okBadge')+'</span>';
return out}
function render(){
const low=S.items.filter(function(x){return x.qty<=2}).length;
const exp=S.items.filter(function(x){const dl=daysLeft(x.expiry);return dl!==null&&dl<=7}).length;
document.getElementById('statItems').textContent=S.items.length;
document.getElementById('statLow').textContent=low;
document.getElementById('statExp').textContent=exp;
const alerts=[];
S.items.forEach(function(x){const dl=daysLeft(x.expiry);if(x.qty<=2)alerts.push({err:false,text:x.name+' — '+t('lowBadge')+' ('+x.qty+' '+esc(x.unit||'')+')'});if(dl!==null&&dl<0)alerts.push({err:true,text:x.name+' — '+t('expiredBadge')});else if(dl!==null&&dl<=7)alerts.push({err:false,text:x.name+' — '+dl+' '+t('daysLeft')})});
document.getElementById('alertBox').innerHTML=alerts.length?alerts.map(function(a){return '<p class="alert-line" style="margin-top:var(--spacing-2)"><span class="dot'+(a.err?' err':'')+'"></span><span>'+esc(a.text)+'</span></p>'}).join(''):'<p class="alert-line"><span class="dot" style="background:var(--color-success)"></span><span class="muted">'+t('noAlerts')+'</span></p>';
document.getElementById('listItems').innerHTML=S.items.length?S.items.map(function(x){return '<div class="row"><span class="grow"><strong>'+esc(x.name)+'</strong><br><span class="muted small">'+esc(x.expiry||'—')+'</span></span>'+badgesFor(x)+'<button class="btn btn-ghost btn-sm qty-btn" type="button" data-act="minus" data-id="'+x.id+'" aria-label="Minus">−</button><span>'+x.qty+' '+esc(x.unit||'')+'</span><button class="btn btn-ghost btn-sm qty-btn" type="button" data-act="plus" data-id="'+x.id+'" aria-label="Plus">+</button><button class="btn btn-danger btn-sm" type="button" data-act="delItem" data-id="'+x.id+'">'+t('del')+'</button></div>'}).join(''):'<p class="empty">'+t('emptyItems')+'</p>';
document.getElementById('listChores').innerHTML=S.chores.length?S.chores.map(function(x){return '<div class="row"><input type="checkbox" data-act="toggleChore" data-id="'+x.id+'"'+(x.done?' checked':'')+' aria-label="Done"><span class="grow'+(x.done?' done-text':'')+'">'+esc(x.label)+'</span>'+(x.who?'<span class="badge">'+esc(x.who)+'</span>':'')+'<button class="btn btn-danger btn-sm" type="button" data-act="delChore" data-id="'+x.id+'">'+t('del')+'</button></div>'}).join(''):'<p class="empty">'+t('emptyChores')+'</p>';
applyI18n();
}
document.addEventListener('click',function(e){const b=e.target.closest('[data-act]');if(!b)return;const id=+b.getAttribute('data-id');const act=b.getAttribute('data-act');if(act==='delItem'){S.items=S.items.filter(function(x){return x.id!==id});save();render()}if(act==='delChore'){S.chores=S.chores.filter(function(x){return x.id!==id});save();render()}if(act==='plus'||act==='minus'){const it=S.items.find(function(x){return x.id===id});if(it){it.qty=Math.max(0,it.qty+(act==='plus'?1:-1));save();render()}}});
document.addEventListener('change',function(e){const b=e.target.closest('[data-act="toggleChore"]');if(!b)return;const it=S.chores.find(function(x){return x.id===+b.getAttribute('data-id')});if(it){it.done=b.checked;save();render()}});
document.getElementById('formItem').addEventListener('submit',function(e){e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')).trim();if(!name)return;S.items.push({id:uid++,name:name,qty:Math.max(0,+f.get('qty')||0),unit:String(f.get('unit')||'').trim(),expiry:String(f.get('expiry')||'')});save();e.target.reset();render()});
document.getElementById('formChore').addEventListener('submit',function(e){e.preventDefault();const f=new FormData(e.target);const label=String(f.get('label')).trim();if(!label)return;S.chores.push({id:uid++,label:label,who:String(f.get('who')||'').trim(),done:false});save();e.target.reset();render()});
document.getElementById('langBtn').addEventListener('click',function(){S.lang=S.lang==='en'?'zh':'en';save();render()});
save();render();
</script>
</body>
</html>
