<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holiday Feast Planner — 节日大餐策划 | Muse Space</title>
<meta name="description" content="Holiday Feast Planner Muse Space template: plan a big holiday meal in one place — event details and countdown, guests and dietary notes, a menu by course, a prep timeline and a shopping list.">
<style>
:root {
  color-scheme: light dark;

  /* ===== Color: core semantic ===== */
  --color-accent: light-dark(#0064E0, #0171E3);
  --color-accent-muted: light-dark(#0082FB33, #0082FB3F);
  --color-on-accent: light-dark(#FFFFFF, #FFFFFF);
  --color-neutral: light-dark(rgba(5, 54, 89, 0.1), rgba(223, 226, 229, 0.2));
  --color-background-body: light-dark(#F1F4F7, #111112);
  --color-background-surface: light-dark(#FFFFFF, #1F1F22);
  --color-background-card: light-dark(#FFFFFF, #1F1F22);
  --color-background-popover: light-dark(#FFFFFF, #28292C);
  --color-background-muted: light-dark(#0536590C, #1111127F);
  --color-background-inverted: light-dark(#0A1317, #FFFFFF);
  --color-overlay: light-dark(#01122866, #11111299);
  --color-overlay-hover: light-dark(#0536590C, #FFFFFF0C);
  --color-overlay-pressed: light-dark(#05365919, #FFFFFF19);

  /* Text */
  --color-text-primary: light-dark(#0A1317, #DFE2E5);
  --color-text-secondary: light-dark(#4E606F, #AAAFB5);
  --color-text-disabled: light-dark(#A4B0BC, #6F747C);
  --color-text-accent: light-dark(#0064E0, #3E9EFB);
  --color-on-dark: light-dark(#FFFFFF, #FFFFFF);
  --color-on-light: light-dark(#000000, #000000);

  /* Icon（与 text 同值域） */
  --color-icon-accent: light-dark(#0064E0, #2694FE);
  --color-icon-primary: light-dark(#0A1317, #DFE2E5);
  --color-icon-secondary: light-dark(#4E606F, #AAAFB5);
  --color-icon-disabled: light-dark(#A4B0BC, #6F747C);

  /* Status fills + muted + on-* */
  --color-info: light-dark(#0064E0, #0064E0);
  --color-info-muted: light-dark(#0082FB33, #0082FB3F);
  --color-on-info: light-dark(#FFFFFF, #FFFFFF);
  --color-success: light-dark(#0D8626, #0D8626);
  --color-success-muted: light-dark(#0B991F33, #0B991F3F);
  --color-on-success: light-dark(#FFFFFF, #FFFFFF);
  --color-error: light-dark(#E3193B, #F5394F);
  --color-error-muted: light-dark(#E3193B33, #F5394F3F);
  --color-on-error: light-dark(#FFFFFF, #0A1317);
  --color-background-error-inverted: light-dark(#AA071E, #E3193B);
  --color-warning: light-dark(#E9AF08, #F2C00B);
  --color-warning-muted: light-dark(#E2A40033, #E2A4003F);
  --color-on-warning: light-dark(#0A1317, #0A1317);

  /* Status text / icon / border（落在页面与卡片面上、对比 >= 4.5:1 的一档） */
  --color-text-blue: light-dark(#042F97, #AFD7FF);
  --color-text-green: light-dark(#09441F, #A5F690);
  --color-text-yellow: light-dark(#753F07, #FBCE03);
  --color-text-red: light-dark(#7B0210, #FFB2B8);
  --color-text-info: var(--color-text-blue);
  --color-text-success: var(--color-text-green);
  --color-text-warning: var(--color-text-yellow);
  --color-text-error: var(--color-text-red);
  --color-icon-info: var(--color-text-info);
  --color-icon-success: var(--color-text-success);
  --color-icon-warning: var(--color-text-warning);
  --color-icon-error: var(--color-text-error);
  --color-border-info: var(--color-text-info);
  --color-border-success: var(--color-text-success);
  --color-border-warning: var(--color-text-warning);
  --color-border-error: var(--color-text-error);
  --color-on-info-muted: var(--color-text-blue);
  --color-on-success-muted: var(--color-text-green);
  --color-on-warning-muted: var(--color-text-yellow);
  --color-on-error-muted: var(--color-text-red);

  /* Border / effects */
  --color-border: light-dark(#05365919, #F2F4F619);
  --color-border-emphasized: light-dark(#CCD3DB, #494D53);
  --color-skeleton: light-dark(#CCD3DB, #5A5E66);
  --color-track: light-dark(#CCD3DB, #5A5E66);
  --color-shadow: light-dark(rgba(5, 54, 89, 0.1), rgba(0, 0, 0, 0.3));
  --color-tint-hover: light-dark(black, white);

  /* Hue families: background(33 alpha) / border / icon / text */
  --color-background-blue: light-dark(#0171E333, #0171E333);
  --color-border-blue: light-dark(#0064E0, #2694FE);
  --color-icon-blue: light-dark(#0064E0, #2694FE);
  --color-background-cyan: light-dark(#03A7D733, #03A7D733);
  --color-border-cyan: light-dark(#089DD0, #0171A4);
  --color-icon-cyan: light-dark(#00ACC1, #26C6DA);
  --color-text-cyan: light-dark(#014975, #A1EEF9);
  --color-background-gray: light-dark(#0A131733, #666A724C);
  --color-border-gray: light-dark(#647685, #748695);
  --color-icon-gray: light-dark(#4E606F, #AAAFB5);
  --color-text-gray: light-dark(#0A1317, #E7EAED);
  --color-background-green: light-dark(#24BB5E33, #24BB5E33);
  --color-border-green: light-dark(#0D8626, #0B991F);
  --color-icon-green: light-dark(#0D8626, #26A756);
  --color-background-orange: light-dark(#F2790233, #F2790233);
  --color-border-orange: light-dark(#EB6E00, #B34A01);
  --color-icon-orange: light-dark(#E9690B, #FB8C00);
  --color-text-orange: light-dark(#6B2203, #FDB876);
  --color-background-pink: light-dark(#E638B333, #E638B333);
  --color-border-pink: light-dark(#F351C0, #C02294);
  --color-icon-pink: light-dark(#C2185B, #EC407A);
  --color-text-pink: light-dark(#650053, #FEADE3);
  --color-background-purple: light-dark(#7952FF33, #7952FF33);
  --color-border-purple: light-dark(#9081FF, #7340FE);
  --color-icon-purple: light-dark(#5B08D8, #7952FF);
  --color-text-purple: light-dark(#3E0697, #B3B0FE);
  --color-background-red: light-dark(#E3193B33, #E3193B33);
  --color-border-red: light-dark(#E3193B, #F5394F);
  --color-icon-red: light-dark(#D31130, #E3193B);
  --color-background-teal: light-dark(#0DB7AF33, #0DB7AF33);
  --color-border-teal: light-dark(#08A3A3, #08767D);
  --color-icon-teal: light-dark(#009688, #26A69A);
  --color-text-teal: light-dark(#083943, #40DCCD);
  --color-background-yellow: light-dark(#E2A40033, #E2A40033);
  --color-border-yellow: light-dark(#C58600, #B47700);
  --color-icon-yellow: light-dark(#FBC02D, #FFEE58);

  /* ===== Spacing: 4px 基准、rem 制（随根字号缩放），步进 0..12 ===== */
  --spacing-0: 0rem;
  --spacing-0-5: 0.125rem;
  --spacing-1: 0.25rem;
  --spacing-1-5: 0.375rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-5: 1.25rem;
  --spacing-6: 1.5rem;
  --spacing-7: 1.75rem;
  --spacing-8: 2rem;
  --spacing-9: 2.25rem;
  --spacing-10: 2.5rem;
  --spacing-11: 2.75rem;
  --spacing-12: 3rem;

  /* ===== Size: 控件高度 ===== */
  --size-element-sm: 28px;
  --size-element-md: 32px;
  --size-element-lg: 36px;

  /* ===== Border / Focus ===== */
  --border-width: 1px;
  --focus-outline-width: 2px;
  --focus-outline-style: solid;
  --focus-outline-color: var(--color-accent);
  --focus-outline-offset: 3px;

  /* ===== Radius（core 默认；neutral 主题的 6/10/12/28 变体不采用） ===== */
  --radius-none: 0px;
  --radius-inner: 4px;
  --radius-element: 8px;
  --radius-container: 12px;
  --radius-page: 28px;
  --radius-chat: 28px;
  --radius-full: 9999px;

  /* ===== Shadow ===== */
  --shadow-low: 0px 1px 1px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 2px 8px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2));
  --shadow-med: 0px 1px 2px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 2px 12px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2));
  --shadow-high: 0px 2px 2px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 8px 24px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3));
  --shadow-inset-hover: inset 0px 0px 0px 2px light-dark(rgba(5, 54, 89, 0.15), rgba(223, 226, 229, 0.2));
  --shadow-inset-selected: inset 0px 0px 0px 2px rgba(1, 113, 227, 0.5);
  --shadow-inset-success: inset 0px 0px 0px 2px rgba(38, 167, 86, 0.3);
  --shadow-inset-warning: inset 0px 0px 0px 2px rgba(226, 164, 0, 0.3);
  --shadow-inset-error: inset 0px 0px 0px 2px rgba(227, 25, 59, 0.3);

  /* ===== Motion ===== */
  --duration-fast-min: 130ms;
  --duration-fast: 175ms;
  --duration-fast-max: 230ms;
  --duration-medium-min: 310ms;
  --duration-medium: 410ms;
  --duration-medium-max: 550ms;
  --duration-slow-min: 730ms;
  --duration-slow: 975ms;
  --duration-slow-max: 1300ms;
  --duration-exit: var(--duration-fast);
  --ease-standard: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-entrance: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-move: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-exit: cubic-bezier(0.3, 0, 0.6, 0.6);

  /* ===== Typography ===== */
  --font-family-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-family-heading: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-family-code: "SF Mono", Monaco, Consolas, monospace;

  /* 几何字阶：round(14 x 1.2^step) */
  --font-size-4xs: 0.375rem;
  --font-size-3xs: 0.4375rem;
  --font-size-2xs: 0.5rem;
  --font-size-xs: 0.625rem;
  --font-size-sm: 0.75rem;
  --font-size-base: 0.875rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.8125rem;
  --font-size-4xl: 2.1875rem;
  --font-size-5xl: 2.625rem;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* 语义字型（size / weight / leading 三件套，组件只许用这一层） */
  --text-heading-1-size: var(--font-size-2xl); --text-heading-1-weight: var(--font-weight-semibold); --text-heading-1-leading: 1.3333;
  --text-heading-2-size: var(--font-size-xl); --text-heading-2-weight: var(--font-weight-semibold); --text-heading-2-leading: 1.4;
  --text-heading-3-size: var(--font-size-lg); --text-heading-3-weight: var(--font-weight-semibold); --text-heading-3-leading: 1.4118;
  --text-heading-4-size: var(--font-size-base); --text-heading-4-weight: var(--font-weight-semibold); --text-heading-4-leading: 1.4286;
  --text-heading-5-size: var(--font-size-sm); --text-heading-5-weight: var(--font-weight-semibold); --text-heading-5-leading: 1.6667;
  --text-heading-6-size: var(--font-size-xs); --text-heading-6-weight: var(--font-weight-semibold); --text-heading-6-leading: 1.6;
  --text-body-size: var(--font-size-base); --text-body-weight: var(--font-weight-normal); --text-body-leading: 1.4286;
  --text-large-size: var(--font-size-lg); --text-large-weight: var(--font-weight-semibold); --text-large-leading: 1.4118;
  --text-label-size: var(--font-size-base); --text-label-weight: var(--font-weight-medium); --text-label-leading: 1.4286;
  --text-code-size: var(--font-size-base); --text-code-weight: var(--font-weight-normal); --text-code-leading: 1.4286;
  --text-supporting-size: var(--font-size-sm); --text-supporting-weight: var(--font-weight-normal); --text-supporting-leading: 1.6667;
  --text-display-1-size: var(--font-size-5xl); --text-display-1-weight: var(--font-weight-normal); --text-display-1-leading: 1.2381;
  --text-display-2-size: var(--font-size-4xl); --text-display-2-weight: var(--font-weight-normal); --text-display-2-leading: 1.2571;
  --text-display-3-size: var(--font-size-3xl); --text-display-3-weight: var(--font-weight-normal); --text-display-3-leading: 1.2414;
}

*{box-sizing:border-box}
body{margin:0;background:var(--color-background-body);color:var(--color-text-primary);font-family:var(--font-family-body);font-size:var(--text-body-size);font-weight:var(--text-body-weight);line-height:var(--text-body-leading)}
:focus-visible{outline:var(--focus-outline-width) var(--focus-outline-style) var(--focus-outline-color);outline-offset:var(--focus-outline-offset)}
.wrap{max-width:64rem;margin:0 auto;padding:var(--spacing-4)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--spacing-3);flex-wrap:wrap;margin-bottom:var(--spacing-4)}
.brand{display:flex;gap:var(--spacing-3);align-items:center}
.logo{color:var(--color-icon-accent);display:grid;place-items:center;background:var(--color-accent-muted);border-radius:var(--radius-container);padding:var(--spacing-2);animation:pulse var(--duration-slow) var(--ease-standard) infinite}
h1{font-size:var(--text-heading-1-size);font-weight:var(--text-heading-1-weight);line-height:var(--text-heading-1-leading);margin:0}
h2{font-size:var(--text-heading-2-size);font-weight:var(--text-heading-2-weight);line-height:var(--text-heading-2-leading);margin:0}
h3{font-size:var(--text-heading-3-size);font-weight:var(--text-heading-3-weight);line-height:var(--text-heading-3-leading);margin:0}
.sub{color:var(--color-text-secondary);font-size:var(--text-supporting-size);margin:var(--spacing-1) 0 0}
.card{background:var(--color-background-card);border:var(--border-width) solid var(--color-border);border-radius:var(--radius-container);padding:var(--spacing-4);box-shadow:var(--shadow-low);animation:rise var(--duration-medium) var(--ease-entrance)}
.stack{display:grid;gap:var(--spacing-3)}
.row{display:flex;gap:var(--spacing-2);flex-wrap:wrap;align-items:center}
.grow{flex:1 1 auto}
.muted{color:var(--color-text-secondary);font-size:var(--text-supporting-size)}
.btn{background:var(--color-accent);color:var(--color-on-accent);border:var(--border-width) solid transparent;border-radius:var(--radius-element);min-height:var(--size-element-md);padding:var(--spacing-1) var(--spacing-3);font-size:var(--text-label-size);font-weight:var(--text-label-weight);cursor:pointer;transition:opacity var(--duration-fast) var(--ease-standard)}
.btn:hover{opacity:.88}
.btn-ghost{background:var(--color-background-surface);color:var(--color-text-primary);border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-element);min-height:var(--size-element-md);padding:var(--spacing-1) var(--spacing-3);font-size:var(--text-label-size);cursor:pointer;transition:background var(--duration-fast) var(--ease-standard)}
.btn-danger{background:var(--color-error-muted);color:var(--color-text-error);border:var(--border-width) solid var(--color-border-error);border-radius:var(--radius-element);min-height:var(--size-element-sm);padding:var(--spacing-1) var(--spacing-2);font-size:var(--text-supporting-size);cursor:pointer}
input,select,textarea{background:var(--color-background-surface);color:var(--color-text-primary);border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-element);min-height:var(--size-element-md);padding:var(--spacing-2);font-size:var(--text-body-size);font-family:var(--font-family-body);width:100%}
textarea{resize:vertical}
.chip{background:var(--color-background-blue);color:var(--color-text-blue);border-radius:var(--radius-full);padding:var(--spacing-0-5) var(--spacing-2);font-size:var(--text-supporting-size);white-space:nowrap}
.chip-green{background:var(--color-background-green);color:var(--color-text-green);border-radius:var(--radius-full);padding:var(--spacing-0-5) var(--spacing-2);font-size:var(--text-supporting-size);white-space:nowrap}
.chip-orange{background:var(--color-background-orange);color:var(--color-text-orange);border-radius:var(--radius-full);padding:var(--spacing-0-5) var(--spacing-2);font-size:var(--text-supporting-size);white-space:nowrap}
.empty{border:var(--border-width) dashed var(--color-border-emphasized);border-radius:var(--radius-container);padding:var(--spacing-6);text-align:center;color:var(--color-text-secondary)}
.progress{background:var(--color-track);border-radius:var(--radius-full);height:var(--spacing-2);overflow:hidden}
.progress-bar{background:var(--color-accent);height:100%;border-radius:var(--radius-full);transition:width var(--duration-medium) var(--ease-move)}
.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--spacing-3);align-items:start}
.course{border:var(--border-width) solid var(--color-border);border-radius:var(--radius-container);padding:var(--spacing-3)}
.dish{border-top:var(--border-width) solid var(--color-border);padding-top:var(--spacing-2)}
.done-text{text-decoration:line-through;color:var(--color-text-disabled)}
@keyframes rise{from{opacity:0;transform:translateY(var(--spacing-2))}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media (max-width:40rem){.courses{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

</style>
</head>
<body>
<div class="wrap"><main>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg></span><div><h1 data-i18n="title"></h1><p class="sub" data-i18n="sub"></p></div></div><button type="button" class="btn-ghost" data-lang-btn>中文</button></header>
<p class="card muted" style="margin:0 0 var(--spacing-3)" data-i18n="note"></p>
<section class="card stack" aria-label="Event">
<div class="row"><h2 class="grow" data-i18n="eventTitle"></h2><span class="chip" data-countdown></span><span class="chip-green" data-guest-count></span></div>
<div class="row"><input class="grow" data-f="eventName" data-i18n-ph="eventNamePh" aria-label="Event name"><input type="date" data-f="eventDate" aria-label="Event date" style="max-width:12rem"></div>
</section>
<section class="card stack" style="margin-top:var(--spacing-3)" aria-label="Guests">
<div class="row"><h2 class="grow" data-i18n="guests"></h2><span class="chip" data-guest-count2></span></div>
<div class="row"><input class="grow" data-f="guestName" data-i18n-ph="guestNamePh" aria-label="Guest name"><input class="grow" data-f="guestDiet" data-i18n-ph="dietPh" aria-label="Dietary notes"><button type="button" class="btn" data-add-guest data-i18n="addGuest"></button></div>
<div class="stack" data-guests></div>
</section>
<section class="card stack" style="margin-top:var(--spacing-3)" aria-label="Menu">
<div class="row"><h2 class="grow" data-i18n="menu"></h2><span class="chip" data-dish-count></span></div>
<div class="courses" data-menu></div>
</section>
<section class="card stack" style="margin-top:var(--spacing-3)" aria-label="Prep timeline">
<div class="row"><h2 class="grow" data-i18n="timeline"></h2><span class="chip" data-task-meta></span></div>
<div class="progress" role="progressbar"><div class="progress-bar" data-taskbar style="width:0%"></div></div>
<h3 data-i18n="daysBefore"></h3>
<div class="stack" data-prep></div>
<div class="row"><input class="grow" data-f="prepText" data-i18n-ph="taskPh" aria-label="Prep task"><input type="number" min="0" max="30" value="3" data-f="prepDays" aria-label="Days before" style="max-width:8rem"><button type="button" class="btn" data-add-prep data-i18n="addTask"></button></div>
<h3 data-i18n="dayOf"></h3>
<div class="stack" data-dayof></div>
<div class="row"><input type="time" value="09:00" data-f="dayTime" aria-label="Time" style="max-width:8rem"><input class="grow" data-f="dayText" data-i18n-ph="taskPh" aria-label="Day-of task"><button type="button" class="btn" data-add-day data-i18n="addTask"></button></div>
</section>
<section class="card stack" style="margin-top:var(--spacing-3)" aria-label="Shopping list">
<div class="row"><h2 class="grow" data-i18n="shopping"></h2><span class="chip" data-shop-meta></span><button type="button" class="btn-ghost" data-suggest data-i18n="suggest"></button></div>
<div class="row"><input class="grow" data-f="itemName" data-i18n-ph="itemPh" aria-label="Shopping item"><input data-f="itemQty" data-i18n-ph="qtyPh" aria-label="Quantity" style="max-width:8rem"><button type="button" class="btn" data-add-item data-i18n="addItem"></button></div>
<div class="stack" data-shopping></div>
</section>
<div class="row" style="margin-top:var(--spacing-3)"><button type="button" class="btn-ghost" data-reset data-i18n="reset"></button><span class="muted grow" data-i18n="resetHint"></span></div>
</main></div>
<script>

const KEY='muse-space:holiday-feast-planner';
const COURSES=['appetizers','mains','sides','desserts','drinks'];
const STATUSES=['planned','prepping','done'];
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function sample(){
  return {lang:'en', event:{name:'Thanksgiving Dinner', date:'2026-11-26'},
  guests:[
    {id:'g1', name:'Alex Morgan', diet:''},
    {id:'g2', name:'Jamie Lee', diet:''},
    {id:'g3', name:'Grandma Rose', diet:''},
    {id:'g4', name:'Uncle James', diet:''},
    {id:'g5', name:'Lena Park', diet:'Vegetarian'},
    {id:'g6', name:'Sam Rivera', diet:'Nut allergy'},
    {id:'g7', name:'Priya Nair', diet:''},
    {id:'g8', name:'Tom Baker', diet:''}
  ],
  menu:{
    appetizers:[
      {id:'d1', name:'Deviled Eggs', cook:'Maya', status:'planned', servings:12},
      {id:'d2', name:'Butternut Squash Soup', cook:'Jamie', status:'planned', servings:8}
    ],
    mains:[
      {id:'d3', name:'Roast Turkey', cook:'Alex', status:'planned', servings:8},
      {id:'d4', name:'Glazed Ham', cook:'Uncle James', status:'planned', servings:8}
    ],
    sides:[
      {id:'d5', name:'Mashed Potatoes', cook:'Grandma Rose', status:'planned', servings:8},
      {id:'d6', name:'Stuffing', cook:'Priya', status:'planned', servings:8},
      {id:'d7', name:'Cranberry Sauce', cook:'Lena', status:'done', servings:8}
    ],
    desserts:[
      {id:'d8', name:'Pumpkin Pie', cook:'Tom', status:'planned', servings:8},
      {id:'d9', name:'Apple Crisp', cook:'Jamie', status:'planned', servings:8}
    ],
    drinks:[
      {id:'d10', name:'Spiced Apple Cider', cook:'Sam', status:'planned', servings:8},
      {id:'d11', name:'Red Wine', cook:'Alex', status:'planned', servings:4}
    ]
  },
  prep:[
    {id:'p1', text:'Buy the turkey and start thawing it in the fridge', days:3, done:false},
    {id:'p2', text:'Make the cranberry sauce', days:2, done:true},
    {id:'p3', text:'Bake the pumpkin pie', days:1, done:false},
    {id:'p4', text:'Chop vegetables and prep the stuffing', days:1, done:false}
  ],
  dayof:[
    {id:'t1', time:'09:00', text:'Preheat the oven to 325°F', done:false},
    {id:'t2', time:'10:00', text:'Turkey goes in the oven', done:false},
    {id:'t3', time:'13:00', text:'Mash the potatoes', done:false},
    {id:'t4', time:'15:00', text:'Set the table', done:false},
    {id:'t5', time:'16:00', text:'Dinner is served', done:false}
  ],
  shopping:[
    {id:'s1', name:'Turkey (18 lb)', qty:'1', bought:false},
    {id:'s2', name:'Potatoes', qty:'5 lb', bought:true},
    {id:'s3', name:'Butter', qty:'2 sticks', bought:false},
    {id:'s4', name:'Pumpkin purée', qty:'2 cans', bought:false},
    {id:'s5', name:'Fresh cranberries', qty:'1 bag', bought:false}
  ]};
}
let state; try{ state=JSON.parse(localStorage.getItem(KEY)); }catch(e){ state=null; }
if(!state || !state.event || !Array.isArray(state.guests) || !state.menu || !Array.isArray(state.prep) || !Array.isArray(state.dayof) || !Array.isArray(state.shopping)){ state=sample(); }
const STR={en:{"title": "Holiday Feast Planner", "sub": "One command center for a big holiday meal: guests, menu, prep and shopping.", "note": "Everything runs in your browser and is saved on this device. No account, no uploads.", "eventTitle": "The event", "eventNamePh": "Event name, e.g. Thanksgiving Dinner", "daysToGo": "days to go", "todayIs": "Today is the day", "daysAgo": "days ago", "guests": "Guests", "guestCount": "guests", "addGuest": "Add guest", "guestNamePh": "Guest name", "dietPh": "Dietary notes, e.g. vegetarian, nut allergy", "noDiet": "No notes", "menu": "Menu", "dishes": "dishes", "addDish": "Add dish", "dishNamePh": "Dish name", "cookPh": "Who cooks it", "cook": "Cook", "servings": "Servings", "status": "Status", "planned": "Planned", "prepping": "Prepping", "done": "Done", "del": "Delete", "timeline": "Prep timeline", "daysBefore": "Days before", "dayOf": "Day-of schedule", "addTask": "Add task", "taskPh": "Task, e.g. buy the turkey", "tasksDone": "tasks done", "shopping": "Shopping list", "suggest": "Suggest from menu", "addItem": "Add item", "itemPh": "Item, e.g. butter", "qtyPh": "Qty", "bought": "bought", "reset": "Reset to Thanksgiving sample", "resetHint": "Clears everything and restores the sample dinner.", "emptyGuests": "No guests yet. Add the first guest above.", "emptyMenu": "No dishes in this course yet.", "emptyPrep": "No prep tasks yet.", "emptyDayOf": "No day-of tasks yet.", "emptyShopping": "Shopping list is empty. Add an item, or suggest from the menu.", "ingredients": "Ingredients: ", "appetizers": "Appetizers", "mains": "Mains", "sides": "Sides", "desserts": "Desserts", "drinks": "Drinks", "dayBeforeLabel": "days before"},zh:{"title": "节日大餐策划", "sub": "一处管好整桌大餐：宾客、菜单、备菜与采购。", "note": "全部在浏览器本地运行，数据只保存在这台设备上。不用注册，不上传。", "eventTitle": "这顿大餐", "eventNamePh": "大餐名称，例如感恩节晚餐", "daysToGo": "天后开席", "todayIs": "就是今天", "daysAgo": "天前已过", "guests": "宾客", "guestCount": "位宾客", "addGuest": "加宾客", "guestNamePh": "宾客姓名", "dietPh": "饮食备注，例如素食、坚果过敏", "noDiet": "无备注", "menu": "菜单", "dishes": "道菜", "addDish": "加菜", "dishNamePh": "菜名", "cookPh": "谁来做", "cook": "主厨", "servings": "份量", "status": "状态", "planned": "计划中", "prepping": "准备中", "done": "已完成", "del": "删除", "timeline": "备菜时间线", "daysBefore": "提前准备", "dayOf": "当天安排", "addTask": "加任务", "taskPh": "任务，例如买火鸡", "tasksDone": "项任务完成", "shopping": "采购清单", "suggest": "按菜单推荐", "addItem": "加采购项", "itemPh": "采购品，例如黄油", "qtyPh": "数量", "bought": "已买", "reset": "恢复感恩节示例", "resetHint": "清空全部内容，恢复示例晚餐。", "emptyGuests": "还没有宾客，在上方添加第一位。", "emptyMenu": "这道菜品还没有菜。", "emptyPrep": "还没有提前准备任务。", "emptyDayOf": "还没有当天任务。", "emptyShopping": "采购清单是空的。手动添加，或按菜单推荐。", "ingredients": "食材：", "appetizers": "开胃菜", "mains": "主菜", "sides": "配菜", "desserts": "甜点", "drinks": "饮品", "dayBeforeLabel": "天前"}};
let lang = (state && state.lang) || 'en';
function t(k){ return STR[lang][k] || STR.en[k] || k; }
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); }); document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); }); document.querySelectorAll('[data-lang-btn]').forEach(function(b){ b.textContent = lang==='en' ? '中文' : 'EN'; }); document.documentElement.lang = lang==='en' ? 'en' : 'zh-CN'; }
document.querySelector('[data-lang-btn]').addEventListener('click', function(){ lang = lang==='en' ? 'zh' : 'en'; state.lang = lang; save(); applyI18n(); render(); });
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function countdownText(){
  if(!state.event.date){ return ''; }
  var p = state.event.date.split('-');
  var d = new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  var now = new Date();
  var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var diff = Math.round((d - today) / 86400000);
  if(diff > 0){ return diff + ' ' + t('daysToGo'); }
  if(diff === 0){ return t('todayIs'); }
  return (-diff) + ' ' + t('daysAgo');
}
function allDishes(){ var out=[]; COURSES.forEach(function(c){ state.menu[c].forEach(function(d){ out.push(d); }); }); return out; }
function render(){
  var nameInput = document.querySelector('[data-f="eventName"]');
  if(document.activeElement !== nameInput){ nameInput.value = state.event.name; }
  var dateInput = document.querySelector('[data-f="eventDate"]');
  if(document.activeElement !== dateInput){ dateInput.value = state.event.date || ''; }
  document.querySelector('[data-countdown]').textContent = countdownText();
  document.querySelector('[data-guest-count]').textContent = state.guests.length + ' ' + t('guestCount');
  document.querySelector('[data-guest-count2]').textContent = state.guests.length + ' ' + t('guestCount');
  document.querySelector('[data-guests]').innerHTML = state.guests.length ? state.guests.map(function(g){
    return '<div class="row"><div class="grow"><strong>' + esc(g.name) + '</strong><p class="muted" style="margin:0">' + esc(g.diet || t('noDiet')) + '</p></div><button type="button" class="btn-danger" data-del-guest="' + g.id + '">' + t('del') + '</button></div>';
  }).join('') : '<div class="empty">' + t('emptyGuests') + '</div>';
  var totalDishes = allDishes().length;
  document.querySelector('[data-dish-count]').textContent = totalDishes + ' ' + t('dishes');
  document.querySelector('[data-menu]').innerHTML = COURSES.map(function(c){
    var dishes = state.menu[c];
    var rows = dishes.length ? dishes.map(function(d){
      return '<div class="dish stack"><div class="row"><strong class="grow">' + esc(d.name) + '</strong><select data-dish-status="' + d.id + '" aria-label="' + t('status') + '" style="width:auto">' + STATUSES.map(function(st){ return '<option value="' + st + '"' + (d.status===st ? ' selected' : '') + '>' + t(st) + '</option>'; }).join('') + '</select><button type="button" class="btn-danger" data-del-dish="' + d.id + '">' + t('del') + '</button></div><p class="muted" style="margin:0">' + t('cook') + ': ' + esc(d.cook || '—') + ' · ' + t('servings') + ': ' + esc(d.servings) + '</p></div>';
    }).join('') : '<div class="empty">' + t('emptyMenu') + '</div>';
    return '<section class="course stack"><div class="row"><h3 class="grow">' + t(c) + '</h3><span class="chip">' + dishes.length + '</span></div>' + rows + '<div class="row"><input class="grow" data-dish-name="' + c + '" placeholder="' + esc(t('dishNamePh')) + '" aria-label="Dish name"><input data-dish-cook="' + c + '" placeholder="' + esc(t('cookPh')) + '" aria-label="Who cooks it" style="max-width:8rem"><input type="number" min="1" value="4" data-dish-servings="' + c + '" aria-label="Servings" style="max-width:5rem"><button type="button" class="btn" data-add-dish="' + c + '">' + t('addDish') + '</button></div></section>';
  }).join('');
  var tasks = state.prep.concat(state.dayof);
  var doneCount = tasks.filter(function(x){ return x.done; }).length;
  var pct = tasks.length ? Math.round(doneCount / tasks.length * 100) : 0;
  document.querySelector('[data-taskbar]').style.width = pct + '%';
  document.querySelector('[data-task-meta]').textContent = doneCount + ' / ' + tasks.length + ' ' + t('tasksDone');
  document.querySelector('[data-prep]').innerHTML = state.prep.length ? state.prep.map(function(p){
    return '<label class="row"><input type="checkbox" data-task="prep" data-task-id="' + p.id + '"' + (p.done ? ' checked' : '') + ' style="width:auto;min-height:auto"><span class="grow' + (p.done ? ' done-text' : '') + '">' + esc(p.text) + '</span><span class="chip">' + p.days + ' ' + t('dayBeforeLabel') + '</span><button type="button" class="btn-danger" data-del-task="prep" data-task-id="' + p.id + '">' + t('del') + '</button></label>';
  }).join('') : '<div class="empty">' + t('emptyPrep') + '</div>';
  document.querySelector('[data-dayof]').innerHTML = state.dayof.length ? state.dayof.map(function(p){
    return '<label class="row"><input type="checkbox" data-task="dayof" data-task-id="' + p.id + '"' + (p.done ? ' checked' : '') + ' style="width:auto;min-height:auto"><span class="chip">' + esc(p.time) + '</span><span class="grow' + (p.done ? ' done-text' : '') + '">' + esc(p.text) + '</span><button type="button" class="btn-danger" data-del-task="dayof" data-task-id="' + p.id + '">' + t('del') + '</button></label>';
  }).join('') : '<div class="empty">' + t('emptyDayOf') + '</div>';
  var boughtCount = state.shopping.filter(function(x){ return x.bought; }).length;
  document.querySelector('[data-shop-meta]').textContent = boughtCount + ' / ' + state.shopping.length + ' ' + t('bought');
  document.querySelector('[data-shopping]').innerHTML = state.shopping.length ? state.shopping.map(function(it){
    return '<label class="row"><input type="checkbox" data-bought="' + it.id + '"' + (it.bought ? ' checked' : '') + ' style="width:auto;min-height:auto"><span class="grow' + (it.bought ? ' done-text' : '') + '">' + esc(it.name) + '</span><span class="chip">' + esc(it.qty) + '</span><button type="button" class="btn-danger" data-del-item="' + it.id + '">' + t('del') + '</button></label>';
  }).join('') : '<div class="empty">' + t('emptyShopping') + '</div>';
}
document.querySelector('[data-f="eventName"]').addEventListener('change', function(e){ state.event.name = e.target.value.trim(); save(); render(); });
document.querySelector('[data-f="eventDate"]').addEventListener('change', function(e){ state.event.date = e.target.value; save(); render(); });
document.querySelector('[data-add-guest]').addEventListener('click', function(){
  var name = document.querySelector('[data-f="guestName"]').value.trim(); if(!name){ return; }
  var diet = document.querySelector('[data-f="guestDiet"]').value.trim();
  state.guests.push({id:uid(), name:name, diet:diet});
  document.querySelector('[data-f="guestName"]').value=''; document.querySelector('[data-f="guestDiet"]').value='';
  save(); render();
});
document.querySelector('[data-guests]').addEventListener('click', function(e){
  var d=e.target.closest('[data-del-guest]');
  if(d){ state.guests=state.guests.filter(function(g){ return g.id!==d.dataset.delGuest; }); save(); render(); }
});
document.querySelector('[data-menu]').addEventListener('click', function(e){
  var d=e.target.closest('[data-del-dish]');
  if(d){ COURSES.forEach(function(c){ state.menu[c]=state.menu[c].filter(function(x){ return x.id!==d.dataset.delDish; }); }); save(); render(); return; }
  var a=e.target.closest('[data-add-dish]');
  if(a){
    var c=a.dataset.addDish;
    var name=document.querySelector('[data-dish-name="' + c + '"]').value.trim(); if(!name){ return; }
    var cook=document.querySelector('[data-dish-cook="' + c + '"]').value.trim();
    var servings=parseInt(document.querySelector('[data-dish-servings="' + c + '"]').value, 10) || 1;
    state.menu[c].push({id:uid(), name:name, cook:cook, status:'planned', servings:servings});
    document.querySelector('[data-dish-name="' + c + '"]').value=''; document.querySelector('[data-dish-cook="' + c + '"]').value='';
    save(); render();
  }
});
document.querySelector('[data-menu]').addEventListener('change', function(e){
  var s=e.target.closest('[data-dish-status]'); if(!s){ return; }
  var dish=allDishes().find(function(x){ return x.id===s.dataset.dishStatus; });
  if(dish){ dish.status=s.value; save(); render(); }
});
document.querySelector('[data-add-prep]').addEventListener('click', function(){
  var text=document.querySelector('[data-f="prepText"]').value.trim(); if(!text){ return; }
  var days=parseInt(document.querySelector('[data-f="prepDays"]').value, 10);
  if(isNaN(days) || days < 0){ days=0; }
  state.prep.push({id:uid(), text:text, days:days, done:false});
  document.querySelector('[data-f="prepText"]').value='';
  save(); render();
});
document.querySelector('[data-add-day]').addEventListener('click', function(){
  var text=document.querySelector('[data-f="dayText"]').value.trim(); if(!text){ return; }
  var time=document.querySelector('[data-f="dayTime"]').value || '09:00';
  state.dayof.push({id:uid(), time:time, text:text, done:false});
  document.querySelector('[data-f="dayText"]').value='';
  save(); render();
});
function taskList(kind){ return kind==='prep' ? state.prep : state.dayof; }
document.querySelector('[data-prep]').addEventListener('change', function(e){
  var c=e.target.closest('[data-task]'); if(!c){ return; }
  var item=taskList(c.dataset.task).find(function(x){ return x.id===c.dataset.taskId; });
  if(item){ item.done=c.checked; save(); render(); }
});
document.querySelector('[data-dayof]').addEventListener('change', function(e){
  var c=e.target.closest('[data-task]'); if(!c){ return; }
  var item=taskList(c.dataset.task).find(function(x){ return x.id===c.dataset.taskId; });
  if(item){ item.done=c.checked; save(); render(); }
});
document.querySelector('[data-prep]').addEventListener('click', function(e){
  var d=e.target.closest('[data-del-task]');
  if(d){ state.prep=state.prep.filter(function(x){ return x.id!==d.dataset.taskId; }); save(); render(); }
});
document.querySelector('[data-dayof]').addEventListener('click', function(e){
  var d=e.target.closest('[data-del-task]');
  if(d){ state.dayof=state.dayof.filter(function(x){ return x.id!==d.dataset.taskId; }); save(); render(); }
});
document.querySelector('[data-add-item]').addEventListener('click', function(){
  var name=document.querySelector('[data-f="itemName"]').value.trim(); if(!name){ return; }
  var qty=document.querySelector('[data-f="itemQty"]').value.trim() || '1';
  state.shopping.push({id:uid(), name:name, qty:qty, bought:false});
  document.querySelector('[data-f="itemName"]').value=''; document.querySelector('[data-f="itemQty"]').value='';
  save(); render();
});
document.querySelector('[data-suggest]').addEventListener('click', function(){
  var existing=state.shopping.map(function(x){ return x.name.trim().toLowerCase(); });
  allDishes().forEach(function(d){
    var name=t('ingredients') + d.name;
    if(existing.indexOf(name.toLowerCase()) < 0){ state.shopping.push({id:uid(), name:name, qty:'1', bought:false}); existing.push(name.toLowerCase()); }
  });
  save(); render();
});
document.querySelector('[data-shopping]').addEventListener('change', function(e){
  var c=e.target.closest('[data-bought]'); if(!c){ return; }
  var item=state.shopping.find(function(x){ return x.id===c.dataset.bought; });
  if(item){ item.bought=c.checked; save(); render(); }
});
document.querySelector('[data-shopping]').addEventListener('click', function(e){
  var d=e.target.closest('[data-del-item]');
  if(d){ state.shopping=state.shopping.filter(function(x){ return x.id!==d.dataset.delItem; }); save(); render(); }
});
document.querySelector('[data-reset]').addEventListener('click', function(){ state=sample(); state.lang=lang; save(); render(); });
applyI18n(); render();

</script>
</body>
</html>
