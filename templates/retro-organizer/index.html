<style>
:root {
  color-scheme: light dark;

  /* ===== Color: core semantic ===== */
  --color-accent: light-dark(#0064E0, #0171E3);
  --color-accent-muted: light-dark(#0082FB33, #0082FB3F);
  --color-on-accent: light-dark(#FFFFFF, #FFFFFF);
  --color-neutral: light-dark(rgba(5, 54, 89, 0.1), rgba(223, 226, 229, 0.2));
  --color-background-body: light-dark(#F1F4F7, #111112);
  --color-background-surface: light-dark(#FFFFFF, #1F1F22);
  --color-background-card: light-dark(#FFFFFF, #1F1F22);
  --color-background-popover: light-dark(#FFFFFF, #28292C);
  --color-background-muted: light-dark(#0536590C, #1111127F);
  --color-background-inverted: light-dark(#0A1317, #FFFFFF);
  --color-overlay: light-dark(#01122866, #11111299);
  --color-overlay-hover: light-dark(#0536590C, #FFFFFF0C);
  --color-overlay-pressed: light-dark(#05365919, #FFFFFF19);

  /* Text */
  --color-text-primary: light-dark(#0A1317, #DFE2E5);
  --color-text-secondary: light-dark(#4E606F, #AAAFB5);
  --color-text-disabled: light-dark(#A4B0BC, #6F747C);
  --color-text-accent: light-dark(#0064E0, #3E9EFB);
  --color-on-dark: light-dark(#FFFFFF, #FFFFFF);
  --color-on-light: light-dark(#000000, #000000);

  /* Icon（与 text 同值域） */
  --color-icon-accent: light-dark(#0064E0, #2694FE);
  --color-icon-primary: light-dark(#0A1317, #DFE2E5);
  --color-icon-secondary: light-dark(#4E606F, #AAAFB5);
  --color-icon-disabled: light-dark(#A4B0BC, #6F747C);

  /* Status fills + muted + on-* */
  --color-info: light-dark(#0064E0, #0064E0);
  --color-info-muted: light-dark(#0082FB33, #0082FB3F);
  --color-on-info: light-dark(#FFFFFF, #FFFFFF);
  --color-success: light-dark(#0D8626, #0D8626);
  --color-success-muted: light-dark(#0B991F33, #0B991F3F);
  --color-on-success: light-dark(#FFFFFF, #FFFFFF);
  --color-error: light-dark(#E3193B, #F5394F);
  --color-error-muted: light-dark(#E3193B33, #F5394F3F);
  --color-on-error: light-dark(#FFFFFF, #0A1317);
  --color-background-error-inverted: light-dark(#AA071E, #E3193B);
  --color-warning: light-dark(#E9AF08, #F2C00B);
  --color-warning-muted: light-dark(#E2A40033, #E2A4003F);
  --color-on-warning: light-dark(#0A1317, #0A1317);

  /* Status text / icon / border（落在页面与卡片面上、对比 >= 4.5:1 的一档） */
  --color-text-blue: light-dark(#042F97, #AFD7FF);
  --color-text-green: light-dark(#09441F, #A5F690);
  --color-text-yellow: light-dark(#753F07, #FBCE03);
  --color-text-red: light-dark(#7B0210, #FFB2B8);
  --color-text-info: var(--color-text-blue);
  --color-text-success: var(--color-text-green);
  --color-text-warning: var(--color-text-yellow);
  --color-text-error: var(--color-text-red);
  --color-icon-info: var(--color-text-info);
  --color-icon-success: var(--color-text-success);
  --color-icon-warning: var(--color-text-warning);
  --color-icon-error: var(--color-text-error);
  --color-border-info: var(--color-text-info);
  --color-border-success: var(--color-text-success);
  --color-border-warning: var(--color-text-warning);
  --color-border-error: var(--color-text-error);
  --color-on-info-muted: var(--color-text-blue);
  --color-on-success-muted: var(--color-text-green);
  --color-on-warning-muted: var(--color-text-yellow);
  --color-on-error-muted: var(--color-text-red);

  /* Border / effects */
  --color-border: light-dark(#05365919, #F2F4F619);
  --color-border-emphasized: light-dark(#CCD3DB, #494D53);
  --color-skeleton: light-dark(#CCD3DB, #5A5E66);
  --color-track: light-dark(#CCD3DB, #5A5E66);
  --color-shadow: light-dark(rgba(5, 54, 89, 0.1), rgba(0, 0, 0, 0.3));
  --color-tint-hover: light-dark(black, white);

  /* Hue families: background(33 alpha) / border / icon / text */
  --color-background-blue: light-dark(#0171E333, #0171E333);
  --color-border-blue: light-dark(#0064E0, #2694FE);
  --color-icon-blue: light-dark(#0064E0, #2694FE);
  --color-background-cyan: light-dark(#03A7D733, #03A7D733);
  --color-border-cyan: light-dark(#089DD0, #0171A4);
  --color-icon-cyan: light-dark(#00ACC1, #26C6DA);
  --color-text-cyan: light-dark(#014975, #A1EEF9);
  --color-background-gray: light-dark(#0A131733, #666A724C);
  --color-border-gray: light-dark(#647685, #748695);
  --color-icon-gray: light-dark(#4E606F, #AAAFB5);
  --color-text-gray: light-dark(#0A1317, #E7EAED);
  --color-background-green: light-dark(#24BB5E33, #24BB5E33);
  --color-border-green: light-dark(#0D8626, #0B991F);
  --color-icon-green: light-dark(#0D8626, #26A756);
  --color-background-orange: light-dark(#F2790233, #F2790233);
  --color-border-orange: light-dark(#EB6E00, #B34A01);
  --color-icon-orange: light-dark(#E9690B, #FB8C00);
  --color-text-orange: light-dark(#6B2203, #FDB876);
  --color-background-pink: light-dark(#E638B333, #E638B333);
  --color-border-pink: light-dark(#F351C0, #C02294);
  --color-icon-pink: light-dark(#C2185B, #EC407A);
  --color-text-pink: light-dark(#650053, #FEADE3);
  --color-background-purple: light-dark(#7952FF33, #7952FF33);
  --color-border-purple: light-dark(#9081FF, #7340FE);
  --color-icon-purple: light-dark(#5B08D8, #7952FF);
  --color-text-purple: light-dark(#3E0697, #B3B0FE);
  --color-background-red: light-dark(#E3193B33, #E3193B33);
  --color-border-red: light-dark(#E3193B, #F5394F);
  --color-icon-red: light-dark(#D31130, #E3193B);
  --color-background-teal: light-dark(#0DB7AF33, #0DB7AF33);
  --color-border-teal: light-dark(#08A3A3, #08767D);
  --color-icon-teal: light-dark(#009688, #26A69A);
  --color-text-teal: light-dark(#083943, #40DCCD);
  --color-background-yellow: light-dark(#E2A40033, #E2A40033);
  --color-border-yellow: light-dark(#C58600, #B47700);
  --color-icon-yellow: light-dark(#FBC02D, #FFEE58);

  /* ===== Spacing: 4px 基准、rem 制（随根字号缩放），步进 0..12 ===== */
  --spacing-0: 0rem;
  --spacing-0-5: 0.125rem;
  --spacing-1: 0.25rem;
  --spacing-1-5: 0.375rem;
  --spacing-2: 0.5rem;
  --spacing-3: 0.75rem;
  --spacing-4: 1rem;
  --spacing-5: 1.25rem;
  --spacing-6: 1.5rem;
  --spacing-7: 1.75rem;
  --spacing-8: 2rem;
  --spacing-9: 2.25rem;
  --spacing-10: 2.5rem;
  --spacing-11: 2.75rem;
  --spacing-12: 3rem;

  /* ===== Size: 控件高度 ===== */
  --size-element-sm: 28px;
  --size-element-md: 32px;
  --size-element-lg: 36px;

  /* ===== Border / Focus ===== */
  --border-width: 1px;
  --focus-outline-width: 2px;
  --focus-outline-style: solid;
  --focus-outline-color: var(--color-accent);
  --focus-outline-offset: 3px;

  /* ===== Radius（core 默认；neutral 主题的 6/10/12/28 变体不采用） ===== */
  --radius-none: 0px;
  --radius-inner: 4px;
  --radius-element: 8px;
  --radius-container: 12px;
  --radius-page: 28px;
  --radius-chat: 28px;
  --radius-full: 9999px;

  /* ===== Shadow ===== */
  --shadow-low: 0px 1px 1px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 2px 8px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2));
  --shadow-med: 0px 1px 2px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 2px 12px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2));
  --shadow-high: 0px 2px 2px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.2)), 0px 8px 24px light-dark(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3));
  --shadow-inset-hover: inset 0px 0px 0px 2px light-dark(rgba(5, 54, 89, 0.15), rgba(223, 226, 229, 0.2));
  --shadow-inset-selected: inset 0px 0px 0px 2px rgba(1, 113, 227, 0.5);
  --shadow-inset-success: inset 0px 0px 0px 2px rgba(38, 167, 86, 0.3);
  --shadow-inset-warning: inset 0px 0px 0px 2px rgba(226, 164, 0, 0.3);
  --shadow-inset-error: inset 0px 0px 0px 2px rgba(227, 25, 59, 0.3);

  /* ===== Motion ===== */
  --duration-fast-min: 130ms;
  --duration-fast: 175ms;
  --duration-fast-max: 230ms;
  --duration-medium-min: 310ms;
  --duration-medium: 410ms;
  --duration-medium-max: 550ms;
  --duration-slow-min: 730ms;
  --duration-slow: 975ms;
  --duration-slow-max: 1300ms;
  --duration-exit: var(--duration-fast);
  --ease-standard: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-entrance: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-move: cubic-bezier(0.24, 1, 0.4, 1);
  --ease-exit: cubic-bezier(0.3, 0, 0.6, 0.6);

  /* ===== Typography ===== */
  --font-family-body: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-family-heading: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-family-code: "SF Mono", Monaco, Consolas, monospace;

  /* 几何字阶：round(14 x 1.2^step) */
  --font-size-4xs: 0.375rem;
  --font-size-3xs: 0.4375rem;
  --font-size-2xs: 0.5rem;
  --font-size-xs: 0.625rem;
  --font-size-sm: 0.75rem;
  --font-size-base: 0.875rem;
  --font-size-lg: 1.0625rem;
  --font-size-xl: 1.25rem;
  --font-size-2xl: 1.5rem;
  --font-size-3xl: 1.8125rem;
  --font-size-4xl: 2.1875rem;
  --font-size-5xl: 2.625rem;

  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* 语义字型（size / weight / leading 三件套，组件只许用这一层） */
  --text-heading-1-size: var(--font-size-2xl); --text-heading-1-weight: var(--font-weight-semibold); --text-heading-1-leading: 1.3333;
  --text-heading-2-size: var(--font-size-xl); --text-heading-2-weight: var(--font-weight-semibold); --text-heading-2-leading: 1.4;
  --text-heading-3-size: var(--font-size-lg); --text-heading-3-weight: var(--font-weight-semibold); --text-heading-3-leading: 1.4118;
  --text-heading-4-size: var(--font-size-base); --text-heading-4-weight: var(--font-weight-semibold); --text-heading-4-leading: 1.4286;
  --text-heading-5-size: var(--font-size-sm); --text-heading-5-weight: var(--font-weight-semibold); --text-heading-5-leading: 1.6667;
  --text-heading-6-size: var(--font-size-xs); --text-heading-6-weight: var(--font-weight-semibold); --text-heading-6-leading: 1.6;
  --text-body-size: var(--font-size-base); --text-body-weight: var(--font-weight-normal); --text-body-leading: 1.4286;
  --text-large-size: var(--font-size-lg); --text-large-weight: var(--font-weight-semibold); --text-large-leading: 1.4118;
  --text-label-size: var(--font-size-base); --text-label-weight: var(--font-weight-medium); --text-label-leading: 1.4286;
  --text-code-size: var(--font-size-base); --text-code-weight: var(--font-weight-normal); --text-code-leading: 1.4286;
  --text-supporting-size: var(--font-size-sm); --text-supporting-weight: var(--font-weight-normal); --text-supporting-leading: 1.6667;
  --text-display-1-size: var(--font-size-5xl); --text-display-1-weight: var(--font-weight-normal); --text-display-1-leading: 1.2381;
  --text-display-2-size: var(--font-size-4xl); --text-display-2-weight: var(--font-weight-normal); --text-display-2-leading: 1.2571;
  --text-display-3-size: var(--font-size-3xl); --text-display-3-weight: var(--font-weight-normal); --text-display-3-leading: 1.2414;
}

*{box-sizing:border-box}
body{margin:0;background:var(--color-background-body);color:var(--color-text-primary);font-family:var(--font-family-body);font-size:var(--text-body-size);font-weight:var(--text-body-weight);line-height:var(--text-body-leading)}
.wrap{max-width:44rem;margin:0 auto;padding:var(--spacing-6) var(--spacing-4) var(--spacing-12)}
header.top{display:flex;align-items:flex-start;gap:var(--spacing-3);margin-bottom:var(--spacing-5)}
.logo{color:var(--color-icon-accent);flex:none;margin-top:var(--spacing-1);animation:floaty var(--duration-slow) var(--ease-standard) infinite alternate}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(calc(var(--spacing-1) * -1))}}
h1{font-size:var(--text-heading-1-size);font-weight:var(--text-heading-1-weight);line-height:var(--text-heading-1-leading);margin:0}
h2{font-size:var(--text-heading-3-size);font-weight:var(--text-heading-3-weight);line-height:var(--text-heading-3-leading);margin:0 0 var(--spacing-3)}
.sub{color:var(--color-text-secondary);margin:var(--spacing-1) 0 0}
.spacer{flex:1}
.card{background:var(--color-background-card);border:var(--border-width) solid var(--color-border);border-radius:var(--radius-container);padding:var(--spacing-4);box-shadow:var(--shadow-low);margin-bottom:var(--spacing-4)}
.device{background:var(--color-background-card);border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-page);padding:var(--spacing-4);box-shadow:var(--shadow-high)}
.device-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-2);padding:var(--spacing-2) var(--spacing-3);background:var(--color-background-muted);border:var(--border-width) solid var(--color-border);border-radius:var(--radius-container);margin-bottom:var(--spacing-4);font-family:var(--font-family-code);font-size:var(--text-supporting-size);color:var(--color-text-secondary)}
.tabs{display:flex;gap:var(--spacing-2);flex-wrap:wrap;margin-bottom:var(--spacing-4)}
.tab{flex:1;min-width:6rem;background:var(--color-background-muted);color:var(--color-text-primary);border:var(--border-width) solid var(--color-border);border-radius:var(--radius-element);min-height:var(--size-element-lg);padding:0 var(--spacing-2);font-family:inherit;font-size:var(--text-label-size);font-weight:var(--text-label-weight);cursor:pointer;transition:background var(--duration-fast) var(--ease-standard),color var(--duration-fast) var(--ease-standard)}
.tab.active{background:var(--color-accent);color:var(--color-on-accent);border-color:var(--color-accent)}
.panel{display:none;animation:fadein var(--duration-fast) var(--ease-entrance)}
.panel.active{display:block}
.btn{background:var(--color-accent);color:var(--color-on-accent);border:none;border-radius:var(--radius-element);min-height:var(--size-element-md);padding:0 var(--spacing-4);font-family:inherit;font-size:var(--text-label-size);font-weight:var(--text-label-weight);cursor:pointer;transition:opacity var(--duration-fast) var(--ease-standard)}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--color-background-muted);color:var(--color-text-primary)}
.btn.small{min-height:var(--size-element-sm);padding:0 var(--spacing-3);font-size:var(--text-supporting-size)}
.btn.block{width:100%;min-height:var(--size-element-lg)}
.input{width:100%;background:var(--color-background-surface);color:var(--color-text-primary);border:var(--border-width) solid var(--color-border-emphasized);border-radius:var(--radius-element);min-height:var(--size-element-lg);padding:var(--spacing-2) var(--spacing-3);font-family:inherit;font-size:var(--text-body-size)}
textarea.input{min-height:calc(var(--size-element-lg) * 2)}
label{display:block;font-size:var(--text-supporting-size);color:var(--color-text-secondary);margin-bottom:var(--spacing-1)}
.form{display:grid;gap:var(--spacing-3);margin-bottom:var(--spacing-3)}
@media(min-width:40rem){.form{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))}.form .wide{grid-column:span 2}}
.item{display:flex;align-items:center;justify-content:space-between;gap:var(--spacing-3);padding:var(--spacing-3) 0;border-bottom:var(--border-width) solid var(--color-border);animation:fadein var(--duration-fast) var(--ease-entrance)}
.item:last-child{border-bottom:none}
@keyframes fadein{from{opacity:0;transform:translateY(var(--spacing-1))}to{opacity:1;transform:none}}
.muted{color:var(--color-text-secondary);font-size:var(--text-supporting-size)}
.strong{font-weight:var(--font-weight-semibold)}
.when{font-family:var(--font-family-code);font-size:var(--text-supporting-size);color:var(--color-text-secondary)}
.empty{border:var(--border-width) dashed var(--color-border-emphasized);border-radius:var(--radius-container);padding:var(--spacing-5);text-align:center;color:var(--color-text-secondary)}
.badge{display:inline-block;padding:var(--spacing-0-5) var(--spacing-2);border-radius:var(--radius-full);font-size:var(--text-supporting-size);background:var(--color-warning-muted);color:var(--color-on-warning-muted);margin-left:var(--spacing-2)}
.badge.high{background:var(--color-error-muted);color:var(--color-on-error-muted)}
.badge.med{background:var(--color-warning-muted);color:var(--color-on-warning-muted)}
.badge.low{background:var(--color-success-muted);color:var(--color-on-success-muted)}
.del{background:none;border:none;color:var(--color-text-error);cursor:pointer;font-family:inherit;font-size:var(--text-body-size);padding:var(--spacing-1)}
.rowflex{display:flex;gap:var(--spacing-2);align-items:center}
.done .strong{text-decoration:line-through;color:var(--color-text-disabled)}
footer{color:var(--color-text-disabled);font-size:var(--text-supporting-size);text-align:center;margin-top:var(--spacing-6)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
<span class="logo" aria-hidden="true"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="1"/><path d="M10 5h4M10 9h4M10 13h4"/><circle cx="12" cy="18" r="1"/></svg></span>
<div><h1>Retro Organizer</h1><p class="sub" data-i="sub"></p></div>
<div class="spacer"></div>
<button class="btn ghost small" id="langBtn" type="button">中文</button>
</header>
<main>
<div class="device">
<div class="device-bar"><span id="todayLine">–</span><span id="countLine">–</span></div>
<nav class="tabs" aria-label="Organizer tabs">
<button class="tab" type="button" data-tab="datebook" data-i="tabDatebook"></button>
<button class="tab" type="button" data-tab="todo" data-i="tabTodo"></button>
<button class="tab" type="button" data-tab="memo" data-i="tabMemo"></button>
<button class="tab" type="button" data-tab="address" data-i="tabAddress"></button>
</nav>

<section class="panel" id="panel-datebook" aria-label="Datebook">
<h2 data-i="addEvent"></h2>
<form class="form" id="eForm">
<div><label for="eTitle" data-i="title"></label><input class="input" id="eTitle" required data-ph="titlePh"></div>
<div><label for="eDate" data-i="date"></label><input class="input" id="eDate" type="date" required></div>
<div><label for="eTime" data-i="time"></label><input class="input" id="eTime" type="time" required></div>
</form>
<button class="btn block" id="eBtn" type="button" data-i="addBtn"></button>
<div id="eList" style="margin-top:var(--spacing-4)"></div>
<p class="empty" id="eEmpty" hidden data-i="emptyEvents"></p>
</section>

<section class="panel" id="panel-todo" aria-label="To Do">
<h2 data-i="addTodo"></h2>
<form class="form" id="tForm">
<div class="wide"><label for="tTask" data-i="task"></label><input class="input" id="tTask" required data-ph="taskPh"></div>
<div><label for="tPri" data-i="priority"></label><select class="input" id="tPri"><option value="high" data-i="high"></option><option value="medium" data-i="medium"></option><option value="low" data-i="low"></option></select></div>
</form>
<button class="btn block" id="tBtn" type="button" data-i="addBtn"></button>
<div id="tList" style="margin-top:var(--spacing-4)"></div>
<p class="empty" id="tEmpty" hidden data-i="emptyTodos"></p>
</section>

<section class="panel" id="panel-memo" aria-label="Memo">
<h2 data-i="addMemo"></h2>
<form class="form" id="mForm">
<div class="wide"><label for="mTitle" data-i="title"></label><input class="input" id="mTitle" required data-ph="memoTitlePh"></div>
<div class="wide"><label for="mBody" data-i="body"></label><textarea class="input" id="mBody" rows="3" data-ph="memoBodyPh"></textarea></div>
</form>
<button class="btn block" id="mBtn" type="button" data-i="addBtn"></button>
<div id="mList" style="margin-top:var(--spacing-4)"></div>
<p class="empty" id="mEmpty" hidden data-i="emptyMemos"></p>
</section>

<section class="panel" id="panel-address" aria-label="Address Book">
<h2 data-i="addContact"></h2>
<form class="form" id="aForm">
<div><label for="aName" data-i="name"></label><input class="input" id="aName" required data-ph="namePh"></div>
<div><label for="aPhone" data-i="phone"></label><input class="input" id="aPhone" type="tel" data-ph="phonePh"></div>
<div><label for="aEmail" data-i="email"></label><input class="input" id="aEmail" type="email" data-ph="emailPh"></div>
</form>
<button class="btn block" id="aBtn" type="button" data-i="addBtn"></button>
<div id="aList" style="margin-top:var(--spacing-4)"></div>
<p class="empty" id="aEmpty" hidden data-i="emptyContacts"></p>
</section>
</div>
</main>
<footer>Muse Space · Retro Organizer</footer>
</div>
<script>

const KEY='muse-space:retro-organizer';
let lang=(JSON.parse(localStorage.getItem(KEY)||'null')||{}).lang||'en';
const t=k=>(T[lang]&&T[lang][k])||T.en[k]||k;
function applyLang(){document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=t(el.dataset.i)});
document.querySelectorAll('[data-ph]').forEach(el=>{el.placeholder=t(el.dataset.ph)});
document.getElementById('langBtn').textContent=lang==='en'?'中文':'EN';render();}
document.getElementById('langBtn').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';save();applyLang();});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

const T={en:{sub:'A Palm-Pilot-style pocket organizer: datebook, to-do list, memos and address book.',tabDatebook:'Datebook',tabTodo:'To Do',tabMemo:'Memo',tabAddress:'Address Book',addEvent:'Add an event',addTodo:'Add a task',addMemo:'Write a memo',addContact:'Add a contact',title:'Title',titlePh:'e.g. Team standup',date:'Date',time:'Time',task:'Task',taskPh:'e.g. Buy birthday gift',priority:'Priority',high:'High',medium:'Medium',low:'Low',body:'Note',memoTitlePh:'e.g. Gift ideas',memoBodyPh:'Write a short note…',name:'Name',namePh:'e.g. Ada Chen',phone:'Phone',phonePh:'e.g. +1 415 555 0132',email:'Email',emailPh:'e.g. ada@example.com',addBtn:'Add',emptyEvents:'No events yet. Add your first one above.',emptyTodos:'No tasks yet. Add your first one above.',emptyMemos:'No memos yet. Write your first one above.',emptyContacts:'No contacts yet. Add your first one above.',del:'Delete',done:'Done',reopen:'Reopen',eventsToday:'events today',openTodos:'open to-dos',memos:'memos',contacts:'contacts'},
zh:{sub:'掌上电脑风格的口袋效率工具：日程、待办、备忘与通讯录，一机搞定。',tabDatebook:'日程',tabTodo:'待办',tabMemo:'备忘',tabAddress:'通讯录',addEvent:'添加日程',addTodo:'添加待办',addMemo:'写备忘',addContact:'添加联系人',title:'标题',titlePh:'如：团队站会',date:'日期',time:'时间',task:'待办事项',taskPh:'如：给妈妈买生日礼物',priority:'优先级',high:'高',medium:'中',low:'低',body:'内容',memoTitlePh:'如：礼物点子',memoBodyPh:'写一句简短备忘…',name:'姓名',namePh:'如：陈小艾',phone:'电话',phonePh:'如：138 0000 0000',email:'邮箱',emailPh:'如：ada@example.com',addBtn:'添加',emptyEvents:'还没有日程，在上面添加第一条。',emptyTodos:'还没有待办，在上面添加第一条。',emptyMemos:'还没有备忘，在上面写第一条。',emptyContacts:'还没有联系人，在上面添加第一位。',del:'删除',done:'完成',reopen:'恢复',eventsToday:'个今日日程',openTodos:'个未完成待办',memos:'条备忘',contacts:'位联系人'}};
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.events)||!Array.isArray(S.todos)||!Array.isArray(S.memos)||!Array.isArray(S.contacts)){
 S={lang:lang,tab:'datebook',
  events:[{id:uid(),title:'Team standup',date:d(0),time:'09:30'},{id:uid(),title:'Dentist appointment',date:d(1),time:'14:00'},{id:uid(),title:'Flight to Shanghai',date:d(3),time:'08:15'}],
  todos:[{id:uid(),task:'Buy birthday gift for Mom',pri:'high',done:false},{id:uid(),task:'File expense report',pri:'medium',done:false},{id:uid(),task:'Water the plants',pri:'low',done:true}],
  memos:[{id:uid(),title:'Gift ideas',body:'Mom likes tea sets and scarves.'},{id:uid(),title:'Book to read',body:'"The Design of Everyday Things" — chapter 3 notes.'}],
  contacts:[{id:uid(),name:'Ada Chen',phone:'+86 138 0000 0000',email:'ada@example.com'},{id:uid(),name:'Ben Wu',phone:'+1 415 555 0132',email:'ben@example.com'}]}}
lang=S.lang||lang;
function save(){S.lang=lang;localStorage.setItem(KEY,JSON.stringify(S))}
function setTab(tab){S.tab=tab;save();
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+tab));}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
function renderStatus(){
 const now=new Date();
 document.getElementById('todayLine').textContent=now.toLocaleDateString(lang==='zh'?'zh-CN':'en-US',{weekday:'short',month:'short',day:'numeric'});
 const ev=S.events.filter(e=>e.date===today()).length, op=S.todos.filter(x=>!x.done).length;
 document.getElementById('countLine').textContent=ev+' '+t('eventsToday')+' · '+op+' '+t('openTodos')+' · '+S.memos.length+' '+t('memos')+' · '+S.contacts.length+' '+t('contacts');}
function renderEvents(){
 const list=document.getElementById('eList');list.innerHTML='';
 const rows=[...S.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 document.getElementById('eEmpty').hidden=rows.length>0;
 rows.forEach(e=>{const el=document.createElement('div');el.className='item';
  el.innerHTML='<div><span class="when">'+esc(e.date)+' '+esc(e.time)+'</span><br><span class="strong">'+esc(e.title)+'</span></div><button class="del" type="button" aria-label="'+t('del')+'">×</button>';
  el.querySelector('.del').addEventListener('click',()=>{S.events=S.events.filter(x=>x.id!==e.id);save();render();});
  list.appendChild(el);});}
function renderTodos(){
 const list=document.getElementById('tList');list.innerHTML='';
 const rows=[...S.todos].sort((a,b)=>(a.done-b.done)||(a.pri<b.pri?-1:1));
 document.getElementById('tEmpty').hidden=rows.length>0;
 rows.forEach(x=>{const el=document.createElement('div');el.className='item'+(x.done?' done':'');
  el.innerHTML='<div><span class="strong">'+esc(x.task)+'</span> <span class="badge '+x.pri+'">'+t(x.pri)+'</span></div><span class="rowflex"><button class="btn ghost small" type="button">'+(x.done?t('reopen'):t('done'))+'</button><button class="del" type="button" aria-label="'+t('del')+'">×</button></span>';
  el.querySelector('.btn').addEventListener('click',()=>{x.done=!x.done;save();render();});
  el.querySelector('.del').addEventListener('click',()=>{S.todos=S.todos.filter(y=>y.id!==x.id);save();render();});
  list.appendChild(el);});}
function renderMemos(){
 const list=document.getElementById('mList');list.innerHTML='';
 document.getElementById('mEmpty').hidden=S.memos.length>0;
 S.memos.forEach(m=>{const el=document.createElement('div');el.className='item';
  el.innerHTML='<div><span class="strong">'+esc(m.title)+'</span><br><span class="muted">'+esc(m.body)+'</span></div><button class="del" type="button" aria-label="'+t('del')+'">×</button>';
  el.querySelector('.del').addEventListener('click',()=>{S.memos=S.memos.filter(x=>x.id!==m.id);save();render();});
  list.appendChild(el);});}
function renderContacts(){
 const list=document.getElementById('aList');list.innerHTML='';
 document.getElementById('aEmpty').hidden=S.contacts.length>0;
 S.contacts.forEach(c=>{const el=document.createElement('div');el.className='item';
  el.innerHTML='<div><span class="strong">'+esc(c.name)+'</span><br><span class="muted">'+esc(c.phone)+(c.email?' · '+esc(c.email):'')+'</span></div><button class="del" type="button" aria-label="'+t('del')+'">×</button>';
  el.querySelector('.del').addEventListener('click',()=>{S.contacts=S.contacts.filter(x=>x.id!==c.id);save();render();});
  list.appendChild(el);});}
function render(){renderStatus();renderEvents();renderTodos();renderMemos();renderContacts();setTab(S.tab||'datebook');}
document.getElementById('eBtn').addEventListener('click',()=>{const ti=document.getElementById('eTitle').value.trim(),dt=document.getElementById('eDate').value,tm=document.getElementById('eTime').value;
 if(!ti||!dt||!tm)return;
 S.events.push({id:uid(),title:ti,date:dt,time:tm});
 document.getElementById('eTitle').value='';document.getElementById('eTime').value='';save();render();});
document.getElementById('tBtn').addEventListener('click',()=>{const tk=document.getElementById('tTask').value.trim();
 if(!tk)return;
 S.todos.push({id:uid(),task:tk,pri:document.getElementById('tPri').value,done:false});
 document.getElementById('tTask').value='';save();render();});
document.getElementById('mBtn').addEventListener('click',()=>{const ti=document.getElementById('mTitle').value.trim(),bd=document.getElementById('mBody').value.trim();
 if(!ti)return;
 S.memos.push({id:uid(),title:ti,body:bd});
 document.getElementById('mTitle').value='';document.getElementById('mBody').value='';save();render();});
document.getElementById('aBtn').addEventListener('click',()=>{const nm=document.getElementById('aName').value.trim();
 if(!nm)return;
 S.contacts.push({id:uid(),name:nm,phone:document.getElementById('aPhone').value.trim(),email:document.getElementById('aEmail').value.trim()});
 document.getElementById('aName').value='';document.getElementById('aPhone').value='';document.getElementById('aEmail').value='';save();render();});
document.getElementById('eDate').value=today();
save();applyLang();

</script>
</body>
</html>
