  --spacing-0: 0rem;

  --spacing-1: 0.25rem;

  --spacing-2: 0.5rem;

*{box-sizing:border-box}
body{margin:0;background:var(--color-background-body);color:var(--color-text-primary);font-family:var(--font-family-body);font-size:var(--text-body-size);font-weight:var(--text-body-weight);line-height:var(--text-body-leading)}
:focus-visible{outline:var(--focus-outline-width) var(--focus-outline-style) var(--focus-outline-color);outline-offset:var(--focus-outline-offset)}

<style>

<body>
<div class="wrap"><main>
<header class="top"><div class="brand"><span class="logo" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg></span><div><h1 data-i18n="title"></h1><p class="sub" data-i18n="sub"></p></div></div><button type="button" class="btn-ghost" data-lang-btn>中文</button></header>
<section class="card stack" aria-label="Pose of the day">

</section>

</section>

<div class="stack" data-formats></div>

</section>

]]}, {"n": "Carrying a box", "z": "搬箱子", "c": "Daily", "cam": "full-body shot", "f": "the camera", "s": [[50, 32, 50, 62], [50, 36, 70, 54], [50, 36, 30, 54], [30, 54, 30, 72], [30, 72, 70, 72], [70, 72, 70, 54], [50, 62, 40, 92], [50, 62, 60, 92]]}, {"n": "Bowing", "z": "鞠躬", "c": "Daily", "cam": "medium shot", "f": "the right", "s": [[50, 32, 66, 58], [50, 36, 60, 52], [50, 36, 40, 54], [66, 58, 52, 90], [66, 58, 80, 90]]}, {"n": "Side stretch", "z": "侧身拉伸", "c": "Daily", "cam": "full-body shot", "f": "the right", "s": [[50, 32, 50, 62], [50, 36, 70, 20], [50, 36, 34, 52], [50, 62, 66, 88], [50, 62, 34, 90]]}, {"n": "Saluting", "z": "敬礼", "c": "Daily", "cam": "medium shot", "f": "the camera", "s": [[50, 32, 50, 62], [50, 36, 62, 42], [62, 42, 56, 20], [50, 36, 38, 58], [50, 62, 40, 92], [50, 62, 60, 92]]}];
const CATS=["Standing","Sitting","Moving","Daily"];
const CATS_ZH=["站立","坐姿","动态","日常"];
let state; try{ state=JSON.parse(localStorage.getItem(KEY)); }catch(e){ state=null; }
if(!state || typeof state!=='object'){ state={lang:'en'}; }
const STR={en:{"title": "Pose Prompt Generator", "sub": "Pick a pose. Get a ready-to-paste prompt in four formats.", "podTitle": "Pose of the day", "podNote": "One pose a day, to keep your video or image practice moving.", "openPose": "Open this pose", "phSearch": "Search poses, e.g. running", "copy": "Copy", "copied": "Copied", "empty": "No poses match. Try another word or category.", "srcNote": "Stick figures are drawn here as simple guides. Pose ideas inspired by the open pose gallery anhao/ai-pose-gallery-zh on GitHub."},zh:{"title": "姿势提示词生成器", "sub": "点一个姿势，四种格式的提示词直接复制就能用。", "podTitle": "今日姿势", "podNote": "每天一个姿势，练视频或练图都有新东西。", "openPose": "打开这个姿势", "phSearch": "搜姿势，例如奔跑", "copy": "复制", "copied": "已复制", "empty": "没有匹配的姿势，换个词或分类试试。", "srcNote": "火柴人是本站画的骨架示意。姿势灵感来自开源姿势库 anhao/ai-pose-gallery-zh（GitHub）。"}};
let lang = (state && state.lang) || 'en';
function t(k){ return STR[lang][k] || STR.en[k] || k; }
function applyI18n(){ document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = t(el.dataset.i18n); }); document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = t(el.dataset.i18nPh); }); document.querySelectorAll('[data-lang-btn]').forEach(function(b){ b.textContent = lang==='en' ? '中文' : 'EN'; }); document.documentElement.lang = lang==='en' ? 'en' : 'zh-CN'; }
document.querySelector('[data-lang-btn]').addEventListener('click', function(){ lang = lang==='en' ? 'zh' : 'en'; state.lang = lang; save(); applyI18n(); render(); });
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function fig(p){
  var s = '<circle cx="50" cy="16" r="8"/><line x1="50" y1="24" x2="50" y2="32"/>' + p.s.map(function(g){ return '<line x1="' + g[0] + '" y1="' + g[1] + '" x2="' + g[2] + '" y2="' + g[3] + '"/>'; }).join('');
  return '<svg width="100" height="110" viewBox="0 0 100 110" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + s + '</svg>';
}
function prompts(p){
  var core = 'a person ' + p.n.toLowerCase() + ', ' + p.cam + ', facing ' + p.f;
  return [
    {name:'Seedance · video', text:'Video, 5 seconds: ' + core + '. Natural, smooth motion, realistic lighting, steady camera.'},
    {name:'Kling · video', text:'Cinematic video: ' + core + '. Smooth natural movement, film lighting, 5 seconds.'},
    {name:'FLUX · image', text:'Photorealistic image of ' + core + ', natural light, sharp focus, clean background.'},
    {name:'Midjourney · image', text: core + ', photorealistic, natural light --ar 3:4 --v 6'}
  ];
}
function poseOfDay(){
  var d = new Date(); var day = Math.floor(d.getTime() / 86400000);
  return POSES[day % POSES.length];
}
var selected = null;
function render(){
  var q = (document.querySelector('[data-f="q"]').value || '').toLowerCase();
  var cat = document.querySelector('[data-f="cat"]').value;
  var list = POSES.map(function(p, i){ return {p:p, i:i}; }).filter(function(x){
    var okCat = cat==='All' || x.p.c===cat;
    var okQ = !q || x.p.n.toLowerCase().indexOf(q) >= 0 || x.p.z.indexOf(q) >= 0;
    return okCat && okQ;
  });
  document.querySelector('[data-empty]').hidden = list.length > 0;
  document.querySelector('[data-empty]').textContent = t('empty');
  document.querySelector('[data-grid]').innerHTML = list.map(function(x){
    return '<button type="button" class="posecard" data-pose="' + x.i + '"><span class="posefig">' + fig(x.p) + '</span><span class="posename">' + esc(lang==='en' ? x.p.n : x.p.z) + '</span><span class="muted">' + esc(x.p.c) + '</span></button>';
  }).join('');
  var pod = poseOfDay();
  document.querySelector('[data-pod-name]').textContent = lang==='en' ? pod.n : pod.z;
  document.querySelector('[data-pod-fig]').innerHTML = fig(pod);
  document.querySelector('[data-pod-open]').dataset.pose = String(POSES.indexOf(pod));
  if(selected !== null){ showDetail(selected); }
}
function showDetail(i){
  selected = i; var p = POSES[i];
  var d = document.querySelector('[data-detail]'); d.hidden = false;
  document.querySelector('[data-detail-name]').textContent = lang==='en' ? p.n : p.z;
  document.querySelector('[data-detail-cat]').textContent = p.c;
  document.querySelector('[data-formats]').innerHTML = prompts(p).map(function(f, j){
    return '<div class="stack"><div class="row"><strong class="grow">' + esc(f.name) + '</strong><button type="button" class="btn" data-copyfmt="' + j + '">' + t('copy') + '</button></div><p class="muted" style="margin:0">' + esc(f.text) + '</p></div>';
  }).join('');
  d.scrollIntoView({behavior:'smooth', block:'nearest'});
}
document.querySelector('[data-grid]').addEventListener('click', function(e){ var c=e.target.closest('[data-pose]'); if(c){ showDetail(Number(c.dataset.pose)); } });
document.querySelector('[data-pod-open]').addEventListener('click', function(e){ showDetail(Number(e.target.dataset.pose)); });
document.querySelector('[data-detail]').addEventListener('click', function(e){
  var c=e.target.closest('[data-copyfmt]'); if(!c || selected===null){ return; }
  var txt = prompts(POSES[selected])[Number(c.dataset.copyfmt)].text;
  if(navigator.clipboard){ navigator.clipboard.writeText(txt); }
  c.textContent = t('copied'); setTimeout(render, 900);
});
document.querySelector('[data-f="q"]').addEventListener('input', render);
document.querySelector('[data-f="cat"]').addEventListener('change', render);
(function(){
  var sel = document.querySelector('[data-f="cat"]');
  CATS.forEach(function(c, i){ var o=document.createElement('option'); o.value=c; o.textContent = lang==='en' ? c : CATS_ZH[i]; sel.appendChild(o); });
})();
applyI18n(); render();

</script>
